<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Scene Editor</title>
<style>
:root {
  color-scheme: dark;
  --bg: #111;
  --panel: #181818;
  --panel-2: #202020;
  --line: #333;
  --muted: #aaa;
  --text: #eee;
  --accent: #5cf;
  --danger: #f76;
  --warn: #fc5;
  --ok: #8f8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 1120px;
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px;
}
button, select, input {
  font: inherit;
}
button {
  border: 1px solid #3a3a3a;
  background: #222;
  color: var(--text);
  padding: 7px 10px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); color: #fff; }
button:disabled { opacity: .45; cursor: default; border-color: #333; }
select, input[type="number"] {
  width: 100%;
  border: 1px solid #3a3a3a;
  background: #101010;
  color: var(--text);
  padding: 7px 8px;
}
input[type="number"]:focus, select:focus, #canvas:focus {
  outline: 1px solid var(--accent);
  outline-offset: 0;
}
.app {
  display: grid;
  grid-template-rows: 48px 1fr 54px;
  height: 100vh;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
  background: #141414;
}
.brand {
  font-size: 16px;
  letter-spacing: .08em;
  font-weight: 700;
}
.main {
  display: grid;
  grid-template-columns: 260px minmax(560px, 1fr) 280px;
  min-height: 0;
}
.left, .right {
  min-height: 0;
  overflow: hidden;
  background: var(--panel);
}
.left {
  border-right: 1px solid var(--line);
  display: grid;
  grid-template-rows: auto minmax(150px, 1.05fr) minmax(170px, .95fr);
}
.right {
  border-left: 1px solid var(--line);
  display: grid;
  grid-template-rows: 1fr auto;
}
.section {
  min-height: 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-direction: column;
}
.section:last-child { border-bottom: 0; }
.section-title {
  padding: 9px 10px;
  color: var(--muted);
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.chapter-box { padding: 10px; }
.scroll-list {
  min-height: 0;
  overflow-y: auto;
}
.item {
  display: block;
  width: 100%;
  border: 0;
  border-bottom: 1px solid #292929;
  background: transparent;
  color: var(--text);
  text-align: left;
  padding: 8px 10px;
  cursor: pointer;
}
.item:hover { background: #232323; }
.item.active {
  background: #15303a;
  color: #dff8ff;
  border-left: 3px solid var(--accent);
  padding-left: 7px;
}
.item small {
  display: block;
  margin-top: 3px;
  color: #999;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.info {
  padding: 10px;
  line-height: 1.45;
  color: #ccc;
  border-top: 1px solid var(--line);
  background: #151515;
  max-height: 44%;
  overflow-y: auto;
}
.info .label { color: #888; }
.info .text {
  margin-top: 8px;
  color: #eee;
  white-space: pre-wrap;
}
.preview-wrap {
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  overflow: auto;
  background: #0c0c0c;
}
#canvas {
  position: relative;
  overflow: hidden;
  background: #050505;
  box-shadow: 0 0 0 1px #303030, 0 18px 48px rgba(0,0,0,.45);
}
#canvas {
  height: min(100%, calc(100vh - 150px));
  aspect-ratio: 9 / 16;
}
.bg, .overlay, .char, .dialog {
  position: absolute;
  pointer-events: none;
}
.bg {
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.overlay {
  transform: translate(-50%, -50%);
  height: auto;
  opacity: .7;
  object-fit: contain;
}
.char {
  transform: translate(-50%, -50%);
  height: auto;
  cursor: grab;
  pointer-events: auto;
  user-select: none;
}
.char.dragging { cursor: grabbing; }
.char.active-speaker {
  opacity: 1;
  filter: drop-shadow(0 0 14px rgba(85,204,255,.25));
}
.char.inactive-speaker { opacity: .5; }
.dialog {
  transform: translate(-50%, -50%);
  padding: 4% 5% 5%;
  background: rgba(4,4,12,.82);
  border-top: 1px solid rgba(255,255,255,.1);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  color: #fff;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-sizing: border-box;
}
.dialog .speaker {
  color: #FFD700;
  font-weight: 900;
  letter-spacing: .3px;
  margin-bottom: 6px;
  text-shadow: 0 2px 8px rgba(0,0,0,.8);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
.dialog .line-text {
  line-height: 1.7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color: #f0f0f0;
  text-shadow: 0 1px 8px rgba(0,0,0,.9);
  white-space: pre-line;
}
.right-scroll {
  min-height: 0;
  overflow-y: auto;
}
.control-group {
  border-bottom: 1px solid #2b2b2b;
  padding: 11px 12px;
}
.control-group h3 {
  margin: 0 0 10px;
  color: var(--accent);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.grid3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.field label {
  display: block;
  margin-bottom: 4px;
  color: #888;
  font-size: 11px;
}
.field-row {
  display: flex;
  align-items: center;
  gap: 3px;
}
.field-row input[type="number"] {
  flex: 1;
  min-width: 0;
  text-align: center;
}
.field-row input[type="number"]::-webkit-inner-spin-button,
.field-row input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
.field-row input[type="number"] { -moz-appearance: textfield; }
.pm-btn {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  padding: 0;
  font-size: 14px;
  line-height: 1;
  background: #2a2a2a;
  border: 1px solid #444;
  color: #ccc;
  border-radius: 3px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pm-btn:hover { background: #3a3a3a; color: #fff; }
.actions-panel {
  padding: 12px;
  border-top: 1px solid var(--line);
  background: #161616;
}
.actions-panel button {
  width: 100%;
  margin-bottom: 8px;
}
#saveBtn.dirty {
  border-color: var(--warn);
  color: var(--warn);
}
#saveBtn.dirty::after {
  content: " *";
}
.toast {
  position: fixed;
  right: 18px;
  bottom: 66px;
  padding: 10px 13px;
  background: #102a18;
  border: 1px solid #2e7d42;
  color: var(--ok);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .18s ease, transform .18s ease;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateY(0);
}
.bottom {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  border-top: 1px solid var(--line);
  background: #141414;
}
.line-count {
  min-width: 110px;
  text-align: center;
  color: #ddd;
}
.empty {
  padding: 14px;
  color: #888;
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">CAMPAIGN SCENE EDITOR</div>
    <div style="display:flex;align-items:center;gap:16px">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="color:#666;font-size:11px">Font</span>
        <button class="pm-btn" id="fontDecBtn" tabindex="-1">−</button>
        <span id="fontSizeDisplay" style="min-width:34px;text-align:center;font-size:12px;color:#ddd">1.00</span>
        <button class="pm-btn" id="fontIncBtn" tabindex="-1">+</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="color:#666;font-size:11px">Box&nbsp;X</span>
        <button class="pm-btn" id="dxDecBtn" tabindex="-1">−</button>
        <span id="dxDisplay" style="min-width:28px;text-align:center;font-size:12px;color:#ddd">50</span>
        <button class="pm-btn" id="dxIncBtn" tabindex="-1">+</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="color:#666;font-size:11px">Box&nbsp;Y</span>
        <button class="pm-btn" id="dyDecBtn" tabindex="-1">−</button>
        <span id="dyDisplay" style="min-width:28px;text-align:center;font-size:12px;color:#ddd">84</span>
        <button class="pm-btn" id="dyIncBtn" tabindex="-1">+</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="color:#666;font-size:11px">Box&nbsp;W</span>
        <button class="pm-btn" id="dwDecBtn" tabindex="-1">−</button>
        <span id="dwDisplay" style="min-width:28px;text-align:center;font-size:12px;color:#ddd">92</span>
        <button class="pm-btn" id="dwIncBtn" tabindex="-1">+</button>
      </div>
    </div>
  </header>

  <main class="main">
    <aside class="left">
      <section class="section">
        <div class="section-title">Chapter</div>
        <div class="chapter-box">
          <select id="chapterSelect"></select>
        </div>
      </section>

      <section class="section">
        <div class="section-title">Scene List</div>
        <div id="sceneList" class="scroll-list"></div>
        <div id="sceneInfo" class="info"></div>
      </section>

      <section class="section">
        <div class="section-title">Line List</div>
        <div id="lineList" class="scroll-list"></div>
        <div id="lineInfo" class="info"></div>
      </section>
    </aside>

    <section class="preview-wrap">
      <div id="canvas" tabindex="0" aria-label="Campaign preview canvas"></div>
    </section>

    <aside class="right">
      <div>
        <div class="section-title">Layout Controls</div>
        <div id="controls" class="right-scroll"></div>
      </div>
      <div class="actions-panel">
        <button id="resetLayoutBtn" type="button">Reset Overlay</button>
        <button id="importBtn" type="button">Import Backup</button>
        <input id="importFile" type="file" accept=".json" style="display:none">
        <button id="saveBtn" type="button">Save to Game</button>
      </div>
    </aside>
  </main>

  <footer class="bottom">
    <button id="prevBtn" type="button">◀ Prev Line</button>
    <div id="lineCount" class="line-count">Line 0/0</div>
    <button id="nextBtn" type="button">Next Line ▶</button>
  </footer>
</div>
<div id="toast" class="toast">Saved ✓</div>

<script>
const API = '/admin/api/campaign-editor';
const excludedSpeakers = new Set(['player', 'player_silhouette', 'narrator', 'prologue_voice', 'observer']);
const portraitMap = {
  player: 'player_silhouette',
  observer: 'player_silhouette',
  rev_hale: 'hale',
  young_butcher: 'butcher'
};
const defaults = {
  one:      { x: 50, y: 55, w: 60 },
  twoLeft:  { x: 28, y: 55, w: 50 },
  twoRight: { x: 72, y: 55, w: 50 },
  dialog:   { x: 50, y: 84, w: 92 },
  overlay:  { x: 50, y: 44, w: 84 }
};

const els = {
  chapterSelect: document.getElementById('chapterSelect'),
  importBtn: document.getElementById('importBtn'),
  importFile: document.getElementById('importFile'),
  sceneList: document.getElementById('sceneList'),
  lineList: document.getElementById('lineList'),
  sceneInfo: document.getElementById('sceneInfo'),
  lineInfo: document.getElementById('lineInfo'),
  canvas: document.getElementById('canvas'),
  controls: document.getElementById('controls'),
  resetLayoutBtn: document.getElementById('resetLayoutBtn'),
  saveBtn: document.getElementById('saveBtn'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  lineCount: document.getElementById('lineCount'),
  toast: document.getElementById('toast')
};

let chapters = [];
let assets = { backgrounds: [], characters: [] };
let chapter = null;
let currentFile = '';
let selectedSceneIndex = 0;
let selectedLineIndex = 0;
let globalFontSize = parseFloat(localStorage.getItem('editorFontSize') || '1.0');
let globalDialog = JSON.parse(localStorage.getItem('editorDialog') || 'null') || { x: 50, y: 84, w: 92 };
let globalCharacters = JSON.parse(localStorage.getItem('editorCharacters') || '{}');
let globalOverlays = JSON.parse(localStorage.getItem('editorOverlays') || '{}');

function overlayKey() {
  const s = scene();
  return s ? `${currentFile}::${s.id}` : null;
}
let dragState = null;

// 서버 동기화 — 레이아웃 변경 시 debounce 후 POST
let _syncTimer = null;
function layoutPayload() {
  return {
    fontsize: globalFontSize,
    dialog: globalDialog,
    characters: globalCharacters,
    overlays: globalOverlays
  };
}

function hasLayoutPayload(payload) {
  return !!(payload && (
    payload.fontsize != null ||
    (payload.dialog && Object.keys(payload.dialog).length) ||
    (payload.characters && Object.keys(payload.characters).length) ||
    (payload.overlays && Object.keys(payload.overlays).length)
  ));
}

function applyLayoutPayload(payload) {
  if (!payload || typeof payload !== 'object') return;
  if (payload.characters) {
    globalCharacters = payload.characters;
    localStorage.setItem('editorCharacters', JSON.stringify(globalCharacters));
  }
  if (payload.overlays) {
    globalOverlays = payload.overlays;
    localStorage.setItem('editorOverlays', JSON.stringify(globalOverlays));
  }
  if (payload.dialog) {
    globalDialog = payload.dialog;
    localStorage.setItem('editorDialog', JSON.stringify(globalDialog));
  }
  if (payload.fontsize != null) {
    globalFontSize = Number(payload.fontsize) || 1;
    localStorage.setItem('editorFontSize', globalFontSize);
  }
  updateGlobalDisplays();
}

function syncToServerNow() {
  return fetch('/api/campaign/editor-layout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(layoutPayload())
  });
}

function syncToServer() {
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => {
    syncToServerNow().catch(() => {});
  }, 600);
}

function clamp(value, min, max) {
  const number = Number(value);
  if (Number.isNaN(number)) return min;
  return Math.max(min, Math.min(max, number));
}

function cloneLayoutPart(value) {
  return JSON.parse(JSON.stringify(value || {}));
}

function scene() {
  return chapter && chapter.scenes ? chapter.scenes[selectedSceneIndex] : null;
}

function lines() {
  const currentScene = scene();
  return currentScene && Array.isArray(currentScene.lines) ? currentScene.lines : [];
}

function line() {
  return lines()[selectedLineIndex] || null;
}

function textOf(value) {
  if (!value) return '';
  if (typeof value === 'string') return value;
  return value.ko || value.en || '';
}

function titleOf(chapterData, fallback) {
  const raw = chapterData && chapterData.title;
  if (!raw) return fallback;
  return typeof raw === 'object' ? (raw.ko || raw.en || fallback) : String(raw);
}

function normalizeCharacter(id) {
  return portraitMap[id] || id;
}

function assetUrl(kind, id) {
  const suffix = id.endsWith('.png') ? id : `${id}.png`;
  return `/assets/campaign/${kind}/${suffix}`;
}

function ensureSceneLayout() {
  const currentScene = scene();
  if (!currentScene.layout) currentScene.layout = {};
  return currentScene.layout;
}

function getLayoutPart(part, key) {
  if (part === 'characters') return globalCharacters[key] || null;
  if (part === 'overlay') {
    const k = overlayKey();
    return k ? (globalOverlays[k] || null) : null;
  }
  return null;
}

function setLayoutPart(part, key, values) {
  if (part === 'characters') {
    if (!globalCharacters[key]) globalCharacters[key] = {};
    Object.assign(globalCharacters[key], values);
    localStorage.setItem('editorCharacters', JSON.stringify(globalCharacters));
  } else if (part === 'overlay') {
    const k = overlayKey();
    if (!k) return;
    if (!globalOverlays[k]) globalOverlays[k] = {};
    Object.assign(globalOverlays[k], values);
    localStorage.setItem('editorOverlays', JSON.stringify(globalOverlays));
  }
  syncToServer();
}

function fallbackCharacterLayout(characters, index) {
  if (characters.length <= 1) return { ...defaults.one };
  return { ...(index === 0 ? defaults.twoLeft : defaults.twoRight) };
}

function effectiveCharacterLayout(id, visibleCharacters, index) {
  return { ...fallbackCharacterLayout(visibleCharacters, index), ...(getLayoutPart('characters', id) || {}) };
}

function effectiveOverlayLayout() {
  return { ...defaults.overlay, ...(getLayoutPart('overlay') || {}) };
}

function effectiveDialogLayout() {
  return { ...defaults.dialog, ...globalDialog };
}

function visibleCharacters() {
  const currentScene = scene();
  if (!currentScene) return [];
  const ids = [];
  if (Array.isArray(currentScene.characters)) {
    currentScene.characters.forEach(id => ids.push(id));
  } else {
    for (let i = selectedLineIndex; i >= Math.max(0, selectedLineIndex - 1); i--) {
      const speaker = lines()[i] && lines()[i].speaker;
      if (speaker) ids.push(speaker);
    }
  }

  const seen = new Set();
  return ids
    .map(normalizeCharacter)
    .filter(id => id && !excludedSpeakers.has(id))
    .filter(id => {
      if (seen.has(id)) return false;
      seen.add(id);
      return true;
    })
    .slice(0, 2);
}

function activeSpeaker() {
  const speaker = line() && line().speaker;
  return speaker ? normalizeCharacter(speaker) : '';
}

function currentOverlay() {
  return (line() && line().overlay) || (scene() && scene().overlay) || '';
}

function setDirty(value) { /* no-op: 모든 레이아웃 localStorage 자동저장 */ }
function markDirty() {}

function renderChapterOptions() {
  els.chapterSelect.innerHTML = chapters.map(ch => {
    const selected = ch.file === currentFile ? ' selected' : '';
    const label = `${ch.title} (${ch.file})`;
    return `<option value="${escapeHtml(ch.file)}"${selected}>${escapeHtml(label)}</option>`;
  }).join('');
}

function renderSceneList() {
  const scenes = chapter && Array.isArray(chapter.scenes) ? chapter.scenes : [];
  els.sceneList.innerHTML = scenes.map((sc, index) => {
    const active = index === selectedSceneIndex ? ' active' : '';
    const label = `${index + 1}. ${sc.id || 'scene'}`;
    const meta = `${sc.type || 'unknown'} · ${sc.background || 'no background'}`;
    return `<button type="button" class="item${active}" data-scene="${index}">${escapeHtml(label)}<small>${escapeHtml(meta)}</small></button>`;
  }).join('') || '<div class="empty">No scenes</div>';
}

function renderLineList() {
  const currentLines = lines();
  els.lineList.innerHTML = currentLines.map((ln, index) => {
    const active = index === selectedLineIndex ? ' active' : '';
    const speaker = ln.speaker || 'narration';
    const text = textOf(ln.text);
    return `<button type="button" class="item${active}" data-line="${index}">${escapeHtml(index + 1 + '. ' + speaker)}<small>${escapeHtml(text)}</small></button>`;
  }).join('') || '<div class="empty">No lines</div>';
}

function renderInfo() {
  const currentScene = scene();
  const currentLine = line();
  if (currentScene) {
    const count = Array.isArray(currentScene.characters) ? currentScene.characters.length : visibleCharacters().length;
    els.sceneInfo.innerHTML = [
      `<div><span class="label">type:</span> ${escapeHtml(currentScene.type || '')}</div>`,
      `<div><span class="label">background:</span> ${escapeHtml(currentScene.background || '')}</div>`,
      `<div><span class="label">characters:</span> ${count}</div>`
    ].join('');
  } else {
    els.sceneInfo.innerHTML = '<span class="label">No scene selected</span>';
  }

  if (currentLine) {
    els.lineInfo.innerHTML = [
      `<div><span class="label">speaker:</span> ${escapeHtml(currentLine.speaker || 'narration')}</div>`,
      `<div><span class="label">emotion:</span> ${escapeHtml(currentLine.emotion || '')}</div>`,
      `<div class="text">${escapeHtml(textOf(currentLine.text))}</div>`
    ].join('');
  } else {
    els.lineInfo.innerHTML = '<span class="label">No line selected</span>';
  }
}

function renderCanvas() {
  const currentScene = scene();
  const currentLine = line();
  if (!currentScene) {
    els.canvas.innerHTML = '';
    return;
  }

  const chars = visibleCharacters();
  const overlay = currentOverlay();
  const speaker = activeSpeaker();
  const bg = currentScene.background || '';
  const dialog = effectiveDialogLayout();
  const lineText = currentLine ? textOf(currentLine.text) : '';
  const speakerText = currentLine && currentLine.speaker ? currentLine.speaker : '';

  els.canvas.innerHTML = '';

  const bgImg = document.createElement('img');
  bgImg.className = 'bg';
  bgImg.alt = '';
  bgImg.src = assetUrl('backgrounds', bg);
  els.canvas.appendChild(bgImg);

  chars.forEach((id, index) => {
    const layout = effectiveCharacterLayout(id, chars, index);
    const img = document.createElement('img');
    img.className = `char ${speaker === id ? 'active-speaker' : 'inactive-speaker'}`;
    img.alt = id;
    img.dataset.character = id;
    img.draggable = false;
    img.src = assetUrl('characters', id);
    applyPercentBox(img, layout, true);
    img.addEventListener('pointerdown', startDrag);
    els.canvas.appendChild(img);
  });

  if (overlay) {
    const overlayLayout = effectiveOverlayLayout();
    const overlayImg = document.createElement('img');
    overlayImg.className = 'overlay';
    overlayImg.alt = '';
    overlayImg.src = assetUrl('backgrounds', overlay);
    applyPercentBox(overlayImg, overlayLayout, true);
    els.canvas.appendChild(overlayImg);
  }

  const dialogBox = document.createElement('div');
  dialogBox.className = 'dialog';
  applyPercentBox(dialogBox, dialog, false);
  dialogBox.innerHTML = `${speakerText ? `<div class="speaker">${escapeHtml(speakerText)}</div>` : ''}<div class="line-text">${escapeHtml(lineText)}</div>`;
  els.canvas.appendChild(dialogBox);

  // 실제 게임 폰트 크기에 맞게 캔버스 스케일 비례 적용
  // 게임 기준: desktop=1920px, mobile=390px / speaker=1.05rem(16.8px), text=1rem(16px)
  requestAnimationFrame(() => {
    const canvasW = els.canvas.offsetWidth;
    const refW = 390;
    const scale = canvasW / refW;
    const fsMult = globalFontSize;
    const speakerEl = dialogBox.querySelector('.speaker');
    const textEl = dialogBox.querySelector('.line-text');
    if (speakerEl) speakerEl.style.fontSize = (16.8 * scale * fsMult).toFixed(1) + 'px';
    if (textEl) textEl.style.fontSize = (16 * scale * fsMult).toFixed(1) + 'px';
  });
}

function applyPercentBox(el, layout, keepAspect) {
  el.style.left = `${layout.x}%`;
  el.style.top = `${layout.y}%`;
  el.style.width = `${layout.w}%`;
  if (keepAspect) el.style.height = 'auto';
}

function renderControls() {
  const chars = visibleCharacters();
  const overlay = currentOverlay();
  const parts = [];
  chars.forEach((id, index) => {
    const layout = effectiveCharacterLayout(id, chars, index);
    parts.push(controlGroup(`Character: ${id}`, 'characters', id, layout, { minW: 5 }));
  });
  if (overlay) {
    parts.push(controlGroup(`Overlay: ${overlay}`, 'overlay', '', effectiveOverlayLayout(), { minW: 5 }));
  }
  els.controls.innerHTML = parts.join('');
}

function controlGroup(title, part, key, layout, options) {
  return `
    <div class="control-group" data-part="${escapeHtml(part)}" data-key="${escapeHtml(key)}">
      <h3>${escapeHtml(title)}</h3>
      <div class="grid3">
        ${numberField('x', layout.x, 0, 100)}
        ${numberField('y', layout.y, 0, 100)}
        ${numberField('w', layout.w, options.minW, 100)}
      </div>
    </div>
  `;
}


function numberField(name, value, min, max, step) {
  const s = step != null ? step : 1;
  const displayVal = s < 1 ? Number(value).toFixed(2) : Math.round(value);
  return `
    <div class="field">
      <label>${name}</label>
      <div class="field-row">
        <button class="pm-btn" data-pm="-1" data-field="${name}" tabindex="-1">−</button>
        <input type="number" data-field="${name}" min="${min}" max="${max}" step="${s}" value="${displayVal}">
        <button class="pm-btn" data-pm="1" data-field="${name}" tabindex="-1">+</button>
      </div>
    </div>
  `;
}

function renderNav() {
  const total = lines().length;
  els.lineCount.textContent = `Line ${total ? selectedLineIndex + 1 : 0}/${total}`;
  els.prevBtn.disabled = selectedLineIndex <= 0;
  els.nextBtn.disabled = selectedLineIndex >= total - 1;
}

function renderAll() {
  renderChapterOptions();
  renderSceneList();
  renderLineList();
  renderInfo();
  renderCanvas();
  renderControls();
  renderNav();
}

function selectScene(index) {
  selectedSceneIndex = clamp(index, 0, Math.max(0, (chapter.scenes || []).length - 1));
  selectedLineIndex = 0;
  renderAll();
}

function selectLine(index) {
  selectedLineIndex = clamp(index, 0, Math.max(0, lines().length - 1));
  renderAll();
}

async function loadInitial() {
  const [chapterResponse, assetResponse, layoutResponse] = await Promise.all([
    fetch(`${API}/chapters`),
    fetch(`${API}/assets`),
    fetch('/api/campaign/editor-layout').catch(() => null)
  ]);
  if (!chapterResponse.ok) throw new Error('Failed to load chapters');
  if (!assetResponse.ok) throw new Error('Failed to load assets');
  if (layoutResponse && layoutResponse.ok) {
    const serverLayout = await layoutResponse.json().catch(() => ({}));
    if (hasLayoutPayload(serverLayout)) {
      applyLayoutPayload(serverLayout);
    } else if (hasLayoutPayload(layoutPayload())) {
      syncToServerNow().catch(() => {});
    }
  }
  chapters = (await chapterResponse.json()).chapters || [];
  assets = await assetResponse.json();
  if (!chapters.length) {
    els.chapterSelect.innerHTML = '<option>No chapters found</option>';
    return;
  }
  await loadChapter(chapters[0].file);
}

async function loadChapter(file) {
  const response = await fetch(`${API}/chapter/${encodeURIComponent(file)}`);
  if (!response.ok) throw new Error(`Failed to load ${file}`);
  chapter = await response.json();
  currentFile = file;
  selectedSceneIndex = 0;
  selectedLineIndex = 0;
  renderAll();
}

function saveChapter() {
  syncToServerNow().then(showToast).catch(() => alert('Save failed'));
}

function exportBackup() {
  const backup = {
    version: 1,
    savedAt: new Date().toISOString(),
    fontsize: globalFontSize,
    dialog: globalDialog,
    characters: globalCharacters,
    overlays: globalOverlays
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'campaign-layout-backup.json';
  a.click();
  URL.revokeObjectURL(url);
  setDirty(false);
  showToast();
}

function showToast() {
  els.toast.classList.add('show');
  window.setTimeout(() => els.toast.classList.remove('show'), 1300);
}


function resetLayout() {
  // 현재 씬의 오버레이 위치만 초기화
  const k = overlayKey();
  if (k) {
    delete globalOverlays[k];
    localStorage.setItem('editorOverlays', JSON.stringify(globalOverlays));
  }
  renderAll();
}

function updateFromInput(input) {
  const group = input.closest('.control-group');
  const part = group.dataset.part;
  const key = group.dataset.key;
  const field = input.dataset.field;
  let value;
  const min = field === 'w' ? 5 : 0;
  value = clamp(input.value, min, 100);
  input.value = value;
  setLayoutPart(part, key, { [field]: value });
  renderCanvas();
}

function startDrag(event) {
  const id = event.currentTarget.dataset.character;
  const rect = els.canvas.getBoundingClientRect();
  const chars = visibleCharacters();
  const index = chars.indexOf(id);
  const layout = effectiveCharacterLayout(id, chars, index);
  dragState = { id, rect, layout };
  event.currentTarget.classList.add('dragging');
  event.currentTarget.setPointerCapture(event.pointerId);
  window.addEventListener('pointermove', dragMove);
  window.addEventListener('pointerup', endDrag, { once: true });
}

function dragMove(event) {
  if (!dragState) return;
  const x = clamp(((event.clientX - dragState.rect.left) / dragState.rect.width) * 100, 0, 100);
  const y = clamp(((event.clientY - dragState.rect.top) / dragState.rect.height) * 100, 0, 100);
  setLayoutPart('characters', dragState.id, { x: Math.round(x), y: Math.round(y), w: dragState.layout.w });
  renderCanvas();
  renderControls();
}

function endDrag() {
  document.querySelectorAll('.char.dragging').forEach(el => el.classList.remove('dragging'));
  dragState = null;
  window.removeEventListener('pointermove', dragMove);
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

els.chapterSelect.addEventListener('change', event => {
  const nextFile = event.target.value;
  if (nextFile !== currentFile) loadChapter(nextFile).catch(error => alert(error.message));
});

els.sceneList.addEventListener('click', event => {
  const button = event.target.closest('[data-scene]');
  if (button) selectScene(Number(button.dataset.scene));
});

els.lineList.addEventListener('click', event => {
  const button = event.target.closest('[data-line]');
  if (button) selectLine(Number(button.dataset.line));
});

els.controls.addEventListener('input', event => {
  if (event.target.matches('input[type="number"]')) updateFromInput(event.target);
});

els.controls.addEventListener('click', event => {
  const btn = event.target.closest('.pm-btn');
  if (!btn) return;
  const dir = parseInt(btn.dataset.pm, 10);
  const field = btn.dataset.field;
  const input = btn.closest('.field-row').querySelector('input[type="number"]');
  if (!input) return;
  const step = parseFloat(input.step) || 1;
  const newVal = (parseFloat(input.value) || 0) + dir * step;
  input.value = step < 1 ? newVal.toFixed(2) : Math.round(newVal);
  updateFromInput(input);
});

function setGlobalFontSize(v) {
  globalFontSize = Math.round(clamp(v, 0.3, 4.0) * 100) / 100;
  document.getElementById('fontSizeDisplay').textContent = globalFontSize.toFixed(2);
  localStorage.setItem('editorFontSize', globalFontSize);
  syncToServer();
  renderCanvas();
}
function setGlobalDialog(field, v) {
  globalDialog[field] = Math.round(clamp(v, field === 'w' ? 5 : 0, 100));
  document.getElementById(`d${field}Display`).textContent = globalDialog[field];
  localStorage.setItem('editorDialog', JSON.stringify(globalDialog));
  syncToServer();
  renderCanvas();
}
document.getElementById('fontDecBtn').addEventListener('click', () => setGlobalFontSize(globalFontSize - 0.05));
document.getElementById('fontIncBtn').addEventListener('click', () => setGlobalFontSize(globalFontSize + 0.05));
document.getElementById('dxDecBtn').addEventListener('click', () => setGlobalDialog('x', globalDialog.x - 1));
document.getElementById('dxIncBtn').addEventListener('click', () => setGlobalDialog('x', globalDialog.x + 1));
document.getElementById('dyDecBtn').addEventListener('click', () => setGlobalDialog('y', globalDialog.y - 1));
document.getElementById('dyIncBtn').addEventListener('click', () => setGlobalDialog('y', globalDialog.y + 1));
document.getElementById('dwDecBtn').addEventListener('click', () => setGlobalDialog('w', globalDialog.w - 1));
document.getElementById('dwIncBtn').addEventListener('click', () => setGlobalDialog('w', globalDialog.w + 1));
// 초기 표시
function updateGlobalDisplays() {
  document.getElementById('fontSizeDisplay').textContent = Number(globalFontSize || 1).toFixed(2);
  document.getElementById('dxDisplay').textContent = globalDialog.x;
  document.getElementById('dyDisplay').textContent = globalDialog.y;
  document.getElementById('dwDisplay').textContent = globalDialog.w;
}
updateGlobalDisplays();

els.resetLayoutBtn.addEventListener('click', resetLayout);
els.saveBtn.addEventListener('click', () => saveChapter());
els.importBtn.addEventListener('click', () => els.importFile.click());
els.importFile.addEventListener('change', event => {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.characters) { globalCharacters = data.characters; localStorage.setItem('editorCharacters', JSON.stringify(globalCharacters)); }
      if (data.overlays)   { globalOverlays   = data.overlays;   localStorage.setItem('editorOverlays',   JSON.stringify(globalOverlays));   }
      if (data.dialog)     { globalDialog     = data.dialog;     localStorage.setItem('editorDialog',     JSON.stringify(globalDialog));     }
      if (data.fontsize != null) {
        globalFontSize = data.fontsize;
        localStorage.setItem('editorFontSize', globalFontSize);
      }
      updateGlobalDisplays();
      syncToServerNow().catch(() => {});
      renderAll();
      showToast();
    } catch { alert('Invalid backup file'); }
  };
  reader.readAsText(file);
  event.target.value = '';
});
els.prevBtn.addEventListener('click', () => selectLine(selectedLineIndex - 1));
els.nextBtn.addEventListener('click', () => selectLine(selectedLineIndex + 1));

els.canvas.addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft') {
    event.preventDefault();
    selectLine(selectedLineIndex - 1);
  } else if (event.key === 'ArrowRight') {
    event.preventDefault();
    selectLine(selectedLineIndex + 1);
  }
});

loadInitial().catch(error => {
  els.canvas.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
});
</script>
</body>
</html>
