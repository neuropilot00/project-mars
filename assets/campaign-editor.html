<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Scene Editor</title>
<style>
:root {
  color-scheme: dark;
  --bg: #111;
  --panel: #181818;
  --panel-2: #202020;
  --line: #333;
  --muted: #aaa;
  --text: #eee;
  --accent: #5cf;
  --danger: #f76;
  --warn: #fc5;
  --ok: #8f8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 1120px;
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px;
}
button, select, input {
  font: inherit;
}
button {
  border: 1px solid #3a3a3a;
  background: #222;
  color: var(--text);
  padding: 7px 10px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); color: #fff; }
button:disabled { opacity: .45; cursor: default; border-color: #333; }
select, input[type="number"] {
  width: 100%;
  border: 1px solid #3a3a3a;
  background: #101010;
  color: var(--text);
  padding: 7px 8px;
}
input[type="number"]:focus, select:focus, #canvas:focus {
  outline: 1px solid var(--accent);
  outline-offset: 0;
}
.app {
  display: grid;
  grid-template-rows: 48px 1fr 54px;
  height: 100vh;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
  background: #141414;
}
.brand {
  font-size: 16px;
  letter-spacing: .08em;
  font-weight: 700;
}
.view-toggle {
  display: flex;
  gap: 6px;
}
.view-toggle button.active {
  border-color: var(--accent);
  color: var(--accent);
  background: #13262b;
}
.main {
  display: grid;
  grid-template-columns: 260px minmax(560px, 1fr) 280px;
  min-height: 0;
}
.left, .right {
  min-height: 0;
  overflow: hidden;
  background: var(--panel);
}
.left {
  border-right: 1px solid var(--line);
  display: grid;
  grid-template-rows: auto minmax(150px, 1.05fr) minmax(170px, .95fr);
}
.right {
  border-left: 1px solid var(--line);
  display: grid;
  grid-template-rows: 1fr auto;
}
.section {
  min-height: 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-direction: column;
}
.section:last-child { border-bottom: 0; }
.section-title {
  padding: 9px 10px;
  color: var(--muted);
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.chapter-box { padding: 10px; }
.inline-warning {
  display: none;
  margin-top: 9px;
  padding: 9px;
  border: 1px solid #5a4930;
  background: #241f12;
  color: var(--warn);
}
.inline-warning.show { display: block; }
.inline-warning .actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.scroll-list {
  min-height: 0;
  overflow-y: auto;
}
.item {
  display: block;
  width: 100%;
  border: 0;
  border-bottom: 1px solid #292929;
  background: transparent;
  color: var(--text);
  text-align: left;
  padding: 8px 10px;
  cursor: pointer;
}
.item:hover { background: #232323; }
.item.active {
  background: #15303a;
  color: #dff8ff;
  border-left: 3px solid var(--accent);
  padding-left: 7px;
}
.item small {
  display: block;
  margin-top: 3px;
  color: #999;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.info {
  padding: 10px;
  line-height: 1.45;
  color: #ccc;
  border-top: 1px solid var(--line);
  background: #151515;
  max-height: 44%;
  overflow-y: auto;
}
.info .label { color: #888; }
.info .text {
  margin-top: 8px;
  color: #eee;
  white-space: pre-wrap;
}
.preview-wrap {
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  overflow: auto;
  background: #0c0c0c;
}
#canvas {
  position: relative;
  overflow: hidden;
  background: #050505;
  box-shadow: 0 0 0 1px #303030, 0 18px 48px rgba(0,0,0,.45);
}
#canvas.desktop {
  width: min(100%, calc((100vh - 150px) * 16 / 9));
  aspect-ratio: 16 / 9;
}
#canvas.mobile {
  height: min(100%, calc(100vh - 150px));
  aspect-ratio: 9 / 16;
}
.bg, .overlay, .char, .dialog {
  position: absolute;
  pointer-events: none;
}
.bg {
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.overlay {
  transform: translate(-50%, -50%);
  height: auto;
  opacity: .7;
  object-fit: contain;
}
.char {
  transform: translate(-50%, -50%);
  height: auto;
  cursor: grab;
  pointer-events: auto;
  user-select: none;
}
.char.dragging { cursor: grabbing; }
.char.active-speaker {
  opacity: 1;
  filter: drop-shadow(0 0 14px rgba(85,204,255,.25));
}
.char.inactive-speaker { opacity: .5; }
.dialog {
  transform: translate(-50%, -50%);
  padding: 4% 5% 5%;
  background: rgba(4,4,12,.82);
  border-top: 1px solid rgba(255,255,255,.1);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  color: #fff;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-sizing: border-box;
}
.dialog .speaker {
  color: #FFD700;
  font-weight: 900;
  letter-spacing: .3px;
  margin-bottom: 6px;
  text-shadow: 0 2px 8px rgba(0,0,0,.8);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
.dialog .line-text {
  line-height: 1.7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color: #f0f0f0;
  text-shadow: 0 1px 8px rgba(0,0,0,.9);
  white-space: pre-line;
}
.right-scroll {
  min-height: 0;
  overflow-y: auto;
}
.control-group {
  border-bottom: 1px solid #2b2b2b;
  padding: 11px 12px;
}
.control-group h3 {
  margin: 0 0 10px;
  color: var(--accent);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.grid3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.field label {
  display: block;
  margin-bottom: 4px;
  color: #888;
  font-size: 11px;
}
.actions-panel {
  padding: 12px;
  border-top: 1px solid var(--line);
  background: #161616;
}
.actions-panel button {
  width: 100%;
  margin-bottom: 8px;
}
#saveBtn.dirty {
  border-color: var(--warn);
  color: var(--warn);
}
#saveBtn.dirty::after {
  content: " *";
}
.toast {
  position: fixed;
  right: 18px;
  bottom: 66px;
  padding: 10px 13px;
  background: #102a18;
  border: 1px solid #2e7d42;
  color: var(--ok);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .18s ease, transform .18s ease;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateY(0);
}
.bottom {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  border-top: 1px solid var(--line);
  background: #141414;
}
.line-count {
  min-width: 110px;
  text-align: center;
  color: #ddd;
}
.empty {
  padding: 14px;
  color: #888;
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">CAMPAIGN SCENE EDITOR</div>
    <div class="view-toggle" aria-label="Viewport">
      <button id="desktopBtn" type="button" class="active">Desktop</button>
      <button id="mobileBtn" type="button">Mobile</button>
    </div>
  </header>

  <main class="main">
    <aside class="left">
      <section class="section">
        <div class="section-title">Chapter</div>
        <div class="chapter-box">
          <select id="chapterSelect"></select>
          <div id="chapterWarning" class="inline-warning">
            Unsaved changes - save first?
            <div class="actions">
              <button id="continueChapterBtn" type="button">Continue</button>
              <button id="cancelChapterBtn" type="button">Cancel</button>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-title">Scene List</div>
        <div id="sceneList" class="scroll-list"></div>
        <div id="sceneInfo" class="info"></div>
      </section>

      <section class="section">
        <div class="section-title">Line List</div>
        <div id="lineList" class="scroll-list"></div>
        <div id="lineInfo" class="info"></div>
      </section>
    </aside>

    <section class="preview-wrap">
      <div id="canvas" class="desktop" tabindex="0" aria-label="Campaign preview canvas"></div>
    </section>

    <aside class="right">
      <div>
        <div class="section-title">Layout Controls</div>
        <div id="controls" class="right-scroll"></div>
      </div>
      <div class="actions-panel">
        <button id="copyLayoutBtn" type="button">Desktop -> Mobile</button>
        <button id="resetLayoutBtn" type="button">Reset Layout</button>
        <button id="saveBtn" type="button">Save to JSON</button>
      </div>
    </aside>
  </main>

  <footer class="bottom">
    <button id="prevBtn" type="button">◀ Prev Line</button>
    <div id="lineCount" class="line-count">Line 0/0</div>
    <button id="nextBtn" type="button">Next Line ▶</button>
  </footer>
</div>
<div id="toast" class="toast">Saved ✓</div>

<script>
const API = '/admin/api/campaign-editor';
const excludedSpeakers = new Set(['player', 'player_silhouette', 'narrator', 'prologue_voice', 'observer']);
const portraitMap = {
  player: 'player_silhouette',
  observer: 'player_silhouette',
  rev_hale: 'hale',
  young_butcher: 'butcher',
  crow: 'kara_vex'
};
const defaults = {
  desktop: {
    one: { x: 50, y: 55, w: 40 },
    twoLeft: { x: 25, y: 55, w: 35 },
    twoRight: { x: 75, y: 55, w: 35 },
    dialog: { x: 50, y: 82, w: 86, fontSize: 1.0 },
    overlay: { x: 50, y: 44, w: 84 }
  },
  mobile: {
    one: { x: 50, y: 60, w: 65 },
    twoLeft: { x: 35, y: 60, w: 58 },
    twoRight: { x: 65, y: 60, w: 58 },
    dialog: { x: 50, y: 85, w: 90, fontSize: 1.0 },
    overlay: { x: 50, y: 44, w: 84 }
  }
};

const els = {
  chapterSelect: document.getElementById('chapterSelect'),
  chapterWarning: document.getElementById('chapterWarning'),
  continueChapterBtn: document.getElementById('continueChapterBtn'),
  cancelChapterBtn: document.getElementById('cancelChapterBtn'),
  sceneList: document.getElementById('sceneList'),
  lineList: document.getElementById('lineList'),
  sceneInfo: document.getElementById('sceneInfo'),
  lineInfo: document.getElementById('lineInfo'),
  canvas: document.getElementById('canvas'),
  controls: document.getElementById('controls'),
  desktopBtn: document.getElementById('desktopBtn'),
  mobileBtn: document.getElementById('mobileBtn'),
  copyLayoutBtn: document.getElementById('copyLayoutBtn'),
  resetLayoutBtn: document.getElementById('resetLayoutBtn'),
  saveBtn: document.getElementById('saveBtn'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  lineCount: document.getElementById('lineCount'),
  toast: document.getElementById('toast')
};

let chapters = [];
let assets = { backgrounds: [], characters: [] };
let chapter = null;
let currentFile = '';
let pendingFile = '';
let selectedSceneIndex = 0;
let selectedLineIndex = 0;
let mode = 'desktop';
let dirty = false;
let dragState = null;

function clamp(value, min, max) {
  const number = Number(value);
  if (Number.isNaN(number)) return min;
  return Math.max(min, Math.min(max, number));
}

function cloneLayoutPart(value) {
  return JSON.parse(JSON.stringify(value || {}));
}

function scene() {
  return chapter && chapter.scenes ? chapter.scenes[selectedSceneIndex] : null;
}

function lines() {
  const currentScene = scene();
  return currentScene && Array.isArray(currentScene.lines) ? currentScene.lines : [];
}

function line() {
  return lines()[selectedLineIndex] || null;
}

function textOf(value) {
  if (!value) return '';
  if (typeof value === 'string') return value;
  return value.ko || value.en || '';
}

function titleOf(chapterData, fallback) {
  const raw = chapterData && chapterData.title;
  if (!raw) return fallback;
  return typeof raw === 'object' ? (raw.ko || raw.en || fallback) : String(raw);
}

function normalizeCharacter(id) {
  return portraitMap[id] || id;
}

function assetUrl(kind, id) {
  const suffix = id.endsWith('.png') ? id : `${id}.png`;
  return `/assets/campaign/${kind}/${suffix}`;
}

function ensureSceneLayout() {
  const currentScene = scene();
  if (!currentScene.layout) currentScene.layout = {};
  if (!currentScene.layout.desktop) currentScene.layout.desktop = {};
  if (!currentScene.layout.mobile) currentScene.layout.mobile = {};
  if (!currentScene.layout[mode].characters) currentScene.layout[mode].characters = {};
  return currentScene.layout[mode];
}

function getLayoutPart(part, key) {
  const currentScene = scene();
  const modeLayout = currentScene && currentScene.layout && currentScene.layout[mode];
  if (!modeLayout) return null;
  if (part === 'characters') return modeLayout.characters && modeLayout.characters[key] ? modeLayout.characters[key] : null;
  return modeLayout[part] || null;
}

function setLayoutPart(part, key, values) {
  const layout = ensureSceneLayout();
  if (part === 'characters') {
    if (!layout.characters[key]) layout.characters[key] = {};
    Object.assign(layout.characters[key], values);
  } else {
    if (!layout[part]) layout[part] = {};
    Object.assign(layout[part], values);
  }
  markDirty();
}

function fallbackCharacterLayout(characters, index) {
  if (characters.length <= 1) return { ...defaults[mode].one };
  return { ...(index === 0 ? defaults[mode].twoLeft : defaults[mode].twoRight) };
}

function effectiveCharacterLayout(id, visibleCharacters, index) {
  return { ...fallbackCharacterLayout(visibleCharacters, index), ...(getLayoutPart('characters', id) || {}) };
}

function effectiveOverlayLayout() {
  return { ...defaults[mode].overlay, ...(getLayoutPart('overlay') || {}) };
}

function effectiveDialogLayout() {
  return { ...defaults[mode].dialog, ...(getLayoutPart('dialog') || {}) };
}

function visibleCharacters() {
  const currentScene = scene();
  if (!currentScene) return [];
  const ids = [];
  if (Array.isArray(currentScene.characters)) {
    currentScene.characters.forEach(id => ids.push(id));
  } else {
    for (let i = selectedLineIndex; i >= Math.max(0, selectedLineIndex - 1); i--) {
      const speaker = lines()[i] && lines()[i].speaker;
      if (speaker) ids.push(speaker);
    }
  }

  const seen = new Set();
  return ids
    .map(normalizeCharacter)
    .filter(id => id && !excludedSpeakers.has(id))
    .filter(id => {
      if (seen.has(id)) return false;
      seen.add(id);
      return true;
    })
    .slice(0, 2);
}

function activeSpeaker() {
  const speaker = line() && line().speaker;
  return speaker ? normalizeCharacter(speaker) : '';
}

function currentOverlay() {
  return (line() && line().overlay) || (scene() && scene().overlay) || '';
}

function setDirty(value) {
  dirty = value;
  els.saveBtn.classList.toggle('dirty', dirty);
}

function markDirty() {
  setDirty(true);
}

function renderChapterOptions() {
  els.chapterSelect.innerHTML = chapters.map(ch => {
    const selected = ch.file === currentFile ? ' selected' : '';
    const label = `${ch.title} (${ch.file})`;
    return `<option value="${escapeHtml(ch.file)}"${selected}>${escapeHtml(label)}</option>`;
  }).join('');
}

function renderSceneList() {
  const scenes = chapter && Array.isArray(chapter.scenes) ? chapter.scenes : [];
  els.sceneList.innerHTML = scenes.map((sc, index) => {
    const active = index === selectedSceneIndex ? ' active' : '';
    const label = `${index + 1}. ${sc.id || 'scene'}`;
    const meta = `${sc.type || 'unknown'} · ${sc.background || 'no background'}`;
    return `<button type="button" class="item${active}" data-scene="${index}">${escapeHtml(label)}<small>${escapeHtml(meta)}</small></button>`;
  }).join('') || '<div class="empty">No scenes</div>';
}

function renderLineList() {
  const currentLines = lines();
  els.lineList.innerHTML = currentLines.map((ln, index) => {
    const active = index === selectedLineIndex ? ' active' : '';
    const speaker = ln.speaker || 'narration';
    const text = textOf(ln.text);
    return `<button type="button" class="item${active}" data-line="${index}">${escapeHtml(index + 1 + '. ' + speaker)}<small>${escapeHtml(text)}</small></button>`;
  }).join('') || '<div class="empty">No lines</div>';
}

function renderInfo() {
  const currentScene = scene();
  const currentLine = line();
  if (currentScene) {
    const count = Array.isArray(currentScene.characters) ? currentScene.characters.length : visibleCharacters().length;
    els.sceneInfo.innerHTML = [
      `<div><span class="label">type:</span> ${escapeHtml(currentScene.type || '')}</div>`,
      `<div><span class="label">background:</span> ${escapeHtml(currentScene.background || '')}</div>`,
      `<div><span class="label">characters:</span> ${count}</div>`
    ].join('');
  } else {
    els.sceneInfo.innerHTML = '<span class="label">No scene selected</span>';
  }

  if (currentLine) {
    els.lineInfo.innerHTML = [
      `<div><span class="label">speaker:</span> ${escapeHtml(currentLine.speaker || 'narration')}</div>`,
      `<div><span class="label">emotion:</span> ${escapeHtml(currentLine.emotion || '')}</div>`,
      `<div class="text">${escapeHtml(textOf(currentLine.text))}</div>`
    ].join('');
  } else {
    els.lineInfo.innerHTML = '<span class="label">No line selected</span>';
  }
}

function renderCanvas() {
  const currentScene = scene();
  const currentLine = line();
  if (!currentScene) {
    els.canvas.innerHTML = '';
    return;
  }

  const chars = visibleCharacters();
  const overlay = currentOverlay();
  const speaker = activeSpeaker();
  const bg = currentScene.background || '';
  const dialog = effectiveDialogLayout();
  const lineText = currentLine ? textOf(currentLine.text) : '';
  const speakerText = currentLine && currentLine.speaker ? currentLine.speaker : '';

  els.canvas.className = mode;
  els.canvas.innerHTML = '';

  const bgImg = document.createElement('img');
  bgImg.className = 'bg';
  bgImg.alt = '';
  bgImg.src = assetUrl('backgrounds', bg);
  els.canvas.appendChild(bgImg);

  chars.forEach((id, index) => {
    const layout = effectiveCharacterLayout(id, chars, index);
    const img = document.createElement('img');
    img.className = `char ${speaker === id ? 'active-speaker' : 'inactive-speaker'}`;
    img.alt = id;
    img.dataset.character = id;
    img.draggable = false;
    img.src = assetUrl('characters', id);
    applyPercentBox(img, layout, true);
    img.addEventListener('pointerdown', startDrag);
    els.canvas.appendChild(img);
  });

  if (overlay) {
    const overlayLayout = effectiveOverlayLayout();
    const overlayImg = document.createElement('img');
    overlayImg.className = 'overlay';
    overlayImg.alt = '';
    overlayImg.src = assetUrl('backgrounds', overlay);
    applyPercentBox(overlayImg, overlayLayout, true);
    els.canvas.appendChild(overlayImg);
  }

  const dialogBox = document.createElement('div');
  dialogBox.className = 'dialog';
  applyPercentBox(dialogBox, dialog, false);
  dialogBox.innerHTML = `${speakerText ? `<div class="speaker">${escapeHtml(speakerText)}</div>` : ''}<div class="line-text">${escapeHtml(lineText)}</div>`;
  els.canvas.appendChild(dialogBox);

  // 실제 게임 폰트 크기에 맞게 캔버스 스케일 비례 적용
  // 게임 기준: desktop=1920px, mobile=390px / speaker=1.05rem(16.8px), text=1rem(16px)
  requestAnimationFrame(() => {
    const canvasW = els.canvas.offsetWidth;
    const refW = mode === 'desktop' ? 1920 : 390;
    const scale = canvasW / refW;
    const fsMult = (dialog.fontSize != null ? dialog.fontSize : 1.0);
    const speakerEl = dialogBox.querySelector('.speaker');
    const textEl = dialogBox.querySelector('.line-text');
    if (speakerEl) speakerEl.style.fontSize = (16.8 * scale * fsMult).toFixed(1) + 'px';
    if (textEl) textEl.style.fontSize = (16 * scale * fsMult).toFixed(1) + 'px';
  });
}

function applyPercentBox(el, layout, keepAspect) {
  el.style.left = `${layout.x}%`;
  el.style.top = `${layout.y}%`;
  el.style.width = `${layout.w}%`;
  if (keepAspect) el.style.height = 'auto';
}

function renderControls() {
  const chars = visibleCharacters();
  const overlay = currentOverlay();
  const parts = [];
  chars.forEach((id, index) => {
    const layout = effectiveCharacterLayout(id, chars, index);
    parts.push(controlGroup(`Character: ${id}`, 'characters', id, layout, { minW: 5 }));
  });
  if (overlay) {
    parts.push(controlGroup(`Overlay: ${overlay}`, 'overlay', '', effectiveOverlayLayout(), { minW: 5 }));
  }
  parts.push(dialogControlGroup('Dialog Box', effectiveDialogLayout()));
  els.controls.innerHTML = parts.join('');
}

function controlGroup(title, part, key, layout, options) {
  return `
    <div class="control-group" data-part="${escapeHtml(part)}" data-key="${escapeHtml(key)}">
      <h3>${escapeHtml(title)}</h3>
      <div class="grid3">
        ${numberField('x', layout.x, 0, 100)}
        ${numberField('y', layout.y, 0, 100)}
        ${numberField('w', layout.w, options.minW, 100)}
      </div>
    </div>
  `;
}

function dialogControlGroup(title, layout) {
  return `
    <div class="control-group" data-part="dialog" data-key="">
      <h3>${escapeHtml(title)}</h3>
      <div class="grid3">
        ${numberField('x', layout.x, 0, 100)}
        ${numberField('y', layout.y, 0, 100)}
        ${numberField('w', layout.w, 5, 100)}
      </div>
      <div style="margin-top:8px">
        ${numberField('fontSize', layout.fontSize != null ? layout.fontSize : 1.0, 0.3, 4.0, 0.05)}
      </div>
    </div>
  `;
}

function numberField(name, value, min, max, step) {
  const s = step != null ? step : 1;
  const displayVal = s < 1 ? Number(value).toFixed(2) : Math.round(value);
  return `
    <div class="field">
      <label>${name}</label>
      <input type="number" data-field="${name}" min="${min}" max="${max}" step="${s}" value="${displayVal}">
    </div>
  `;
}

function renderNav() {
  const total = lines().length;
  els.lineCount.textContent = `Line ${total ? selectedLineIndex + 1 : 0}/${total}`;
  els.prevBtn.disabled = selectedLineIndex <= 0;
  els.nextBtn.disabled = selectedLineIndex >= total - 1;
}

function renderAll() {
  renderChapterOptions();
  renderSceneList();
  renderLineList();
  renderInfo();
  renderCanvas();
  renderControls();
  renderNav();
}

function selectScene(index) {
  selectedSceneIndex = clamp(index, 0, Math.max(0, (chapter.scenes || []).length - 1));
  selectedLineIndex = 0;
  renderAll();
}

function selectLine(index) {
  selectedLineIndex = clamp(index, 0, Math.max(0, lines().length - 1));
  renderAll();
}

async function loadInitial() {
  const [chapterResponse, assetResponse] = await Promise.all([
    fetch(`${API}/chapters`),
    fetch(`${API}/assets`)
  ]);
  if (!chapterResponse.ok) throw new Error('Failed to load chapters');
  if (!assetResponse.ok) throw new Error('Failed to load assets');
  chapters = (await chapterResponse.json()).chapters || [];
  assets = await assetResponse.json();
  if (!chapters.length) {
    els.chapterSelect.innerHTML = '<option>No chapters found</option>';
    return;
  }
  await loadChapter(chapters[0].file);
}

async function loadChapter(file) {
  const response = await fetch(`${API}/chapter/${encodeURIComponent(file)}`);
  if (!response.ok) throw new Error(`Failed to load ${file}`);
  chapter = await response.json();
  currentFile = file;
  pendingFile = '';
  selectedSceneIndex = 0;
  selectedLineIndex = 0;
  setDirty(false);
  els.chapterWarning.classList.remove('show');
  renderAll();
}

async function saveChapter() {
  if (!chapter || !currentFile) return;
  const response = await fetch(`${API}/chapter/${encodeURIComponent(currentFile)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(chapter)
  });
  if (!response.ok) throw new Error('Save failed');
  setDirty(false);
  showToast();
}

function showToast() {
  els.toast.classList.add('show');
  window.setTimeout(() => els.toast.classList.remove('show'), 1300);
}

function copyDesktopToMobile() {
  const currentScene = scene();
  if (!currentScene) return;
  if (!currentScene.layout) currentScene.layout = {};
  currentScene.layout.mobile = cloneLayoutPart(currentScene.layout.desktop || {});
  markDirty();
  if (mode === 'mobile') renderAll();
}

function resetLayout() {
  const currentScene = scene();
  if (!currentScene) return;
  delete currentScene.layout;
  markDirty();
  renderAll();
}

function updateFromInput(input) {
  const group = input.closest('.control-group');
  const part = group.dataset.part;
  const key = group.dataset.key;
  const field = input.dataset.field;
  let value;
  if (field === 'fontSize') {
    value = clamp(parseFloat(input.value) || 1.0, 0.3, 4.0);
    input.value = value.toFixed(2);
  } else {
    const min = field === 'w' ? 5 : 0;
    value = clamp(input.value, min, 100);
    input.value = value;
  }
  setLayoutPart(part, key, { [field]: value });
  renderCanvas();
}

function startDrag(event) {
  const id = event.currentTarget.dataset.character;
  const rect = els.canvas.getBoundingClientRect();
  const chars = visibleCharacters();
  const index = chars.indexOf(id);
  const layout = effectiveCharacterLayout(id, chars, index);
  dragState = { id, rect, layout };
  event.currentTarget.classList.add('dragging');
  event.currentTarget.setPointerCapture(event.pointerId);
  window.addEventListener('pointermove', dragMove);
  window.addEventListener('pointerup', endDrag, { once: true });
}

function dragMove(event) {
  if (!dragState) return;
  const x = clamp(((event.clientX - dragState.rect.left) / dragState.rect.width) * 100, 0, 100);
  const y = clamp(((event.clientY - dragState.rect.top) / dragState.rect.height) * 100, 0, 100);
  setLayoutPart('characters', dragState.id, { x: Math.round(x), y: Math.round(y), w: dragState.layout.w });
  renderCanvas();
  renderControls();
}

function endDrag() {
  document.querySelectorAll('.char.dragging').forEach(el => el.classList.remove('dragging'));
  dragState = null;
  window.removeEventListener('pointermove', dragMove);
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

els.chapterSelect.addEventListener('change', event => {
  const nextFile = event.target.value;
  if (nextFile === currentFile) return;
  if (dirty) {
    pendingFile = nextFile;
    els.chapterWarning.classList.add('show');
    els.chapterSelect.value = currentFile;
    return;
  }
  loadChapter(nextFile).catch(error => alert(error.message));
});

els.continueChapterBtn.addEventListener('click', () => {
  const nextFile = pendingFile;
  pendingFile = '';
  if (nextFile) loadChapter(nextFile).catch(error => alert(error.message));
});

els.cancelChapterBtn.addEventListener('click', () => {
  pendingFile = '';
  els.chapterWarning.classList.remove('show');
  els.chapterSelect.value = currentFile;
});

els.sceneList.addEventListener('click', event => {
  const button = event.target.closest('[data-scene]');
  if (button) selectScene(Number(button.dataset.scene));
});

els.lineList.addEventListener('click', event => {
  const button = event.target.closest('[data-line]');
  if (button) selectLine(Number(button.dataset.line));
});

els.controls.addEventListener('input', event => {
  if (event.target.matches('input[type="number"]')) updateFromInput(event.target);
});

els.desktopBtn.addEventListener('click', () => {
  mode = 'desktop';
  els.desktopBtn.classList.add('active');
  els.mobileBtn.classList.remove('active');
  renderAll();
});

els.mobileBtn.addEventListener('click', () => {
  mode = 'mobile';
  els.mobileBtn.classList.add('active');
  els.desktopBtn.classList.remove('active');
  renderAll();
});

els.copyLayoutBtn.addEventListener('click', copyDesktopToMobile);
els.resetLayoutBtn.addEventListener('click', resetLayout);
els.saveBtn.addEventListener('click', () => saveChapter().catch(error => alert(error.message)));
els.prevBtn.addEventListener('click', () => selectLine(selectedLineIndex - 1));
els.nextBtn.addEventListener('click', () => selectLine(selectedLineIndex + 1));

els.canvas.addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft') {
    event.preventDefault();
    selectLine(selectedLineIndex - 1);
  } else if (event.key === 'ArrowRight') {
    event.preventDefault();
    selectLine(selectedLineIndex + 1);
  }
});

loadInitial().catch(error => {
  els.canvas.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
});
</script>
</body>
</html>
