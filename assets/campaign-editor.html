<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Campaign Scene Editor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a1a; color: #ccc; font-family: monospace; font-size: 13px; display: flex; height: 100vh; overflow: hidden; }

/* LEFT PANEL */
#left { width: 220px; min-width: 220px; background: #222; border-right: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; }
#left h3 { padding: 8px 10px; background: #2a2a2a; border-bottom: 1px solid #333; color: #aaa; font-size: 11px; letter-spacing: 1px; }
#left select { width: 100%; background: #1a1a1a; color: #ccc; border: none; border-bottom: 1px solid #333; padding: 6px 8px; font-size: 12px; }
#left select:focus { outline: none; background: #252525; }
#bg-section { padding: 8px; border-bottom: 1px solid #333; }
#bg-section label { display: block; font-size: 11px; color: #777; margin-bottom: 4px; }
#ch-section { padding: 8px; border-bottom: 1px solid #333; }
#ch-section label { display: block; font-size: 11px; color: #777; margin-bottom: 4px; }
#ch-section .row { display: flex; gap: 4px; }
#add-btn { flex: 0 0 auto; background: #3a5a3a; color: #7f7; border: none; padding: 4px 8px; cursor: pointer; font-size: 11px; }
#add-btn:hover { background: #4a6a4a; }

/* LAYERS */
#layers-section { flex: 1; overflow-y: auto; }
#layers-section h3 { position: sticky; top: 0; z-index: 1; }
.layer-item { display: flex; align-items: center; gap: 6px; padding: 5px 8px; cursor: pointer; border-bottom: 1px solid #2a2a2a; }
.layer-item:hover { background: #2a2a2a; }
.layer-item.selected { background: #1e3a1e; border-left: 2px solid #4f4; }
.layer-item .thumb { width: 28px; height: 28px; object-fit: contain; background: #111; border: 1px solid #333; }
.layer-item .name { flex: 1; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-del { background: none; border: none; color: #a44; cursor: pointer; font-size: 14px; padding: 0 2px; }
.layer-del:hover { color: #f44; }
.layer-up, .layer-dn { background: none; border: none; color: #666; cursor: pointer; font-size: 10px; padding: 0 1px; }
.layer-up:hover, .layer-dn:hover { color: #aaa; }

/* CANVAS AREA */
#canvas-area { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; background: #111; position: relative; }
#scene-container { position: relative; }
#bg-img { display: block; max-height: 90vh; }
.char-layer { position: absolute; cursor: move; user-select: none; }
.char-layer img { display: block; width: 100%; height: 100%; object-fit: contain; }
.char-layer.selected { outline: 2px solid #4f4; }
.char-layer .handle { position: absolute; width: 10px; height: 10px; background: #4f4; border: 1px solid #000; border-radius: 2px; }
.char-layer .handle.br { bottom: -5px; right: -5px; cursor: se-resize; }
.char-layer .handle.bl { bottom: -5px; left: -5px; cursor: sw-resize; }
.char-layer .handle.tr { top: -5px; right: -5px; cursor: ne-resize; }
.char-layer .handle.tl { top: -5px; left: -5px; cursor: nw-resize; }
.char-layer .handle.bc { bottom: -5px; left: calc(50% - 5px); cursor: s-resize; }
.char-layer .handle.tc { top: -5px; left: calc(50% - 5px); cursor: n-resize; }
.char-layer .handle.lc { left: -5px; top: calc(50% - 5px); cursor: w-resize; }
.char-layer .handle.rc { right: -5px; top: calc(50% - 5px); cursor: e-resize; }

/* RIGHT PANEL */
#right { width: 200px; min-width: 200px; background: #222; border-left: 1px solid #333; overflow-y: auto; }
#right h3 { padding: 8px 10px; background: #2a2a2a; border-bottom: 1px solid #333; color: #aaa; font-size: 11px; letter-spacing: 1px; }
.prop-group { padding: 8px; border-bottom: 1px solid #2a2a2a; }
.prop-group label { display: block; font-size: 10px; color: #666; margin-bottom: 3px; }
.prop-row { display: flex; gap: 6px; margin-bottom: 6px; }
.prop-row label { flex: 0 0 20px; font-size: 11px; color: #888; line-height: 24px; }
.prop-row input[type=number] { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #ccc; padding: 3px 6px; font-size: 12px; width: 100%; }
.prop-row input[type=number]:focus { outline: none; border-color: #4f4; }
.prop-row input[type=range] { flex: 1; }
#btn-export { margin: 8px; width: calc(100% - 16px); background: #1e3a5e; color: #7af; border: none; padding: 7px; cursor: pointer; font-size: 12px; }
#btn-export:hover { background: #2a4a6e; }
#btn-copy { margin: 0 8px 8px; width: calc(100% - 16px); background: #3a2a1e; color: #fa7; border: none; padding: 7px; cursor: pointer; font-size: 12px; }
#btn-copy:hover { background: #4a3a2e; }
#json-out { margin: 8px; width: calc(100% - 16px); background: #111; border: 1px solid #333; color: #888; font-size: 10px; padding: 6px; height: 120px; resize: none; }
#zoom-row { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid #2a2a2a; }
#zoom-row label { font-size: 10px; color: #666; }
#zoom-val { font-size: 11px; color: #aaa; min-width: 32px; }
</style>
</head>
<body>

<!-- LEFT: overlay + character select -->
<div id="left">
  <h3>OVERLAY</h3>
  <div id="bg-section">
    <label>Background</label>
    <select id="bg-select" size="6"></select>
  </div>
  <h3>CHARACTER</h3>
  <div id="ch-section">
    <label>Add Character</label>
    <div class="row">
      <select id="ch-select" style="flex:1"></select>
      <button id="add-btn">ADD</button>
    </div>
  </div>
  <h3>LAYERS</h3>
  <div id="layers-section">
    <div id="layers-list"></div>
  </div>
</div>

<!-- CENTER: canvas -->
<div id="canvas-area">
  <div id="scene-container">
    <img id="bg-img" src="" alt="">
  </div>
</div>

<!-- RIGHT: properties -->
<div id="right">
  <h3>PROPERTIES</h3>
  <div id="zoom-row">
    <label>ZOOM</label>
    <input type="range" id="zoom-slider" min="20" max="200" value="100" style="flex:1">
    <span id="zoom-val">100%</span>
  </div>
  <div class="prop-group" id="props-panel">
    <label>NO LAYER SELECTED</label>
  </div>
  <button id="btn-export">EXPORT JSON</button>
  <button id="btn-copy">COPY TO CLIPBOARD</button>
  <textarea id="json-out" readonly placeholder="layout JSON appears here..."></textarea>
</div>

const bgSelect = document.getElementById('bg-select');
const chSelect = document.getElementById('ch-select');
const bgImg = document.getElementById('bg-img');
const container = document.getElementById('scene-container');
const layersList = document.getElementById('layers-list');
const propsPanel = document.getElementById('props-panel');
const jsonOut = document.getElementById('json-out');
const zoomSlider = document.getElementById('zoom-slider');
const zoomVal = document.getElementById('zoom-val');

BG_LIST.forEach(f => { const o = document.createElement('option'); o.value = f; o.textContent = f.replace('.png',''); bgSelect.appendChild(o); });
CH_LIST.forEach(f => { const o = document.createElement('option'); o.value = f; o.textContent = f.replace('.png',''); chSelect.appendChild(o); });

let layers = []; // {id, file, x, y, w, h, opacity, el}
let selectedId = null;
let zoom = 1;
let nextId = 1;

// BG select
bgSelect.addEventListener('change', () => {
  bgImg.src = '/assets/campaign/backgrounds/' + bgSelect.value;
});
bgImg.addEventListener('load', () => {
  container.style.width = bgImg.offsetWidth + 'px';
  container.style.height = bgImg.offsetHeight + 'px';
});
// init
bgSelect.selectedIndex = 0;
bgImg.src = '/assets/campaign/backgrounds/' + BG_LIST[0];

// Zoom
zoomSlider.addEventListener('input', () => {
  zoom = zoomSlider.value / 100;
  zoomVal.textContent = zoomSlider.value + '%';
  container.style.transform = `scale(${zoom})`;
  container.style.transformOrigin = 'top left';
});

// Add character
document.getElementById('add-btn').addEventListener('click', () => {
  const file = chSelect.value;
  if (!file) return;
  const id = nextId++;
  const bgW = bgImg.offsetWidth || 800;
  const bgH = bgImg.offsetHeight || 800;
  const w = Math.round(bgW * 0.35);
  const h = Math.round(w * 1.5);
  const layer = { id, file, x: Math.round(bgW * 0.3), y: Math.round(bgH - h), w, h, opacity: 1 };
  layers.push(layer);
  createLayerEl(layer);
  renderLayersList();
  selectLayer(id);
});

function createLayerEl(layer) {
  const el = document.createElement('div');
  el.className = 'char-layer';
  el.dataset.id = layer.id;
  el.style.left = layer.x + 'px';
  el.style.top = layer.y + 'px';
  el.style.width = layer.w + 'px';
  el.style.height = layer.h + 'px';
  el.style.opacity = layer.opacity;

  const img = document.createElement('img');
  img.src = '/assets/campaign/characters/' + layer.file;
  img.draggable = false;
  el.appendChild(img);

  // resize handles
  ['tl','tc','tr','lc','rc','bl','bc','br'].forEach(pos => {
    const h = document.createElement('div');
    h.className = 'handle ' + pos;
    h.dataset.handle = pos;
    el.appendChild(h);
  });

  el.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('handle')) return;
    e.preventDefault();
    selectLayer(layer.id);
    startDrag(e, layer);
  });

  el.querySelectorAll('.handle').forEach(h => {
    h.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      selectLayer(layer.id);
      startResize(e, layer, h.dataset.handle);
    });
  });

  layer.el = el;
  container.appendChild(el);
}

function startDrag(e, layer) {
  const startX = e.clientX, startY = e.clientY;
  const origX = layer.x, origY = layer.y;
  function onMove(e) {
    const dx = (e.clientX - startX) / zoom;
    const dy = (e.clientY - startY) / zoom;
    layer.x = Math.round(origX + dx);
    layer.y = Math.round(origY + dy);
    layer.el.style.left = layer.x + 'px';
    layer.el.style.top = layer.y + 'px';
    updatePropsPanel();
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function startResize(e, layer, handle) {
  const startX = e.clientX, startY = e.clientY;
  const origX = layer.x, origY = layer.y, origW = layer.w, origH = layer.h;
  function onMove(e) {
    const dx = (e.clientX - startX) / zoom;
    const dy = (e.clientY - startY) / zoom;
    let nx = origX, ny = origY, nw = origW, nh = origH;
    if (handle.includes('r')) { nw = Math.max(20, origW + dx); }
    if (handle.includes('l')) { nw = Math.max(20, origW - dx); nx = origX + (origW - nw); }
    if (handle.includes('b')) { nh = Math.max(20, origH + dy); }
    if (handle.includes('t')) { nh = Math.max(20, origH - dy); ny = origY + (origH - nh); }
    // if corner, maintain aspect ratio with shift
    layer.x = Math.round(nx); layer.y = Math.round(ny);
    layer.w = Math.round(nw); layer.h = Math.round(nh);
    layer.el.style.left = layer.x + 'px'; layer.el.style.top = layer.y + 'px';
    layer.el.style.width = layer.w + 'px'; layer.el.style.height = layer.h + 'px';
    updatePropsPanel();
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function selectLayer(id) {
  selectedId = id;
  layers.forEach(l => {
    l.el && l.el.classList.toggle('selected', l.id === id);
  });
  renderLayersList();
  updatePropsPanel();
}

function renderLayersList() {
  layersList.innerHTML = '';
  [...layers].reverse().forEach(layer => {
    const item = document.createElement('div');
    item.className = 'layer-item' + (layer.id === selectedId ? ' selected' : '');
    item.innerHTML = `
      <img class="thumb" src="/assets/campaign/characters/${layer.file}">
      <span class="name">${layer.file.replace('.png','')}</span>
      <button class="layer-up" data-id="${layer.id}" title="Up">▲</button>
      <button class="layer-dn" data-id="${layer.id}" title="Down">▼</button>
      <button class="layer-del" data-id="${layer.id}" title="Delete">✕</button>
    `;
    item.addEventListener('click', (e) => {
      if (!e.target.closest('button')) selectLayer(layer.id);
    });
    item.querySelector('.layer-del').addEventListener('click', (e) => { e.stopPropagation(); deleteLayer(layer.id); });
    item.querySelector('.layer-up').addEventListener('click', (e) => { e.stopPropagation(); moveLayer(layer.id, 1); });
    item.querySelector('.layer-dn').addEventListener('click', (e) => { e.stopPropagation(); moveLayer(layer.id, -1); });
    layersList.appendChild(item);
  });
}

function deleteLayer(id) {
  const layer = layers.find(l => l.id === id);
  if (layer && layer.el) layer.el.remove();
  layers = layers.filter(l => l.id !== id);
  if (selectedId === id) selectedId = null;
  renderLayersList();
  updatePropsPanel();
}

function moveLayer(id, dir) {
  const idx = layers.findIndex(l => l.id === id);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= layers.length) return;
  [layers[idx], layers[newIdx]] = [layers[newIdx], layers[idx]];
  // reorder DOM
  layers.forEach(l => container.appendChild(l.el));
  renderLayersList();
}

function updatePropsPanel() {
  const layer = layers.find(l => l.id === selectedId);
  if (!layer) {
    propsPanel.innerHTML = '<label>NO LAYER SELECTED</label>';
    return;
  }
  propsPanel.innerHTML = `
    <label>${layer.file.replace('.png','')}</label>
    <div class="prop-row"><label>X</label><input type="number" id="p-x" value="${layer.x}"></div>
    <div class="prop-row"><label>Y</label><input type="number" id="p-y" value="${layer.y}"></div>
    <div class="prop-row"><label>W</label><input type="number" id="p-w" value="${layer.w}"></div>
    <div class="prop-row"><label>H</label><input type="number" id="p-h" value="${layer.h}"></div>
    <div class="prop-row"><label>α</label><input type="range" id="p-op" min="0" max="1" step="0.05" value="${layer.opacity}"></div>
    <div style="padding:2px 0 0 26px;font-size:10px;color:#666">opacity: ${layer.opacity}</div>
  `;
  const bind = (pid, prop, isFloat) => {
    document.getElementById(pid).addEventListener('input', (e) => {
      layer[prop] = isFloat ? parseFloat(e.target.value) : parseInt(e.target.value);
      layer.el.style.left = layer.x + 'px';
      layer.el.style.top = layer.y + 'px';
      layer.el.style.width = layer.w + 'px';
      layer.el.style.height = layer.h + 'px';
      layer.el.style.opacity = layer.opacity;
      if (pid === 'p-op') {
        propsPanel.querySelector('div:last-child').textContent = 'opacity: ' + layer.opacity;
      }
    });
  };
  bind('p-x','x'); bind('p-y','y'); bind('p-w','w'); bind('p-h','h'); bind('p-op','opacity',true);
}

function exportLayout() {
  const bgW = bgImg.naturalWidth || bgImg.offsetWidth;
  const bgH = bgImg.naturalHeight || bgImg.offsetHeight;
  const data = {
    background: bgSelect.value,
    bg_display_size: { w: bgImg.offsetWidth, h: bgImg.offsetHeight },
    bg_natural_size: { w: bgW, h: bgH },
    characters: layers.map(l => ({
      file: l.file,
      x: l.x, y: l.y,
      w: l.w, h: l.h,
      opacity: l.opacity,
      // normalized 0-1 relative to display size
      x_pct: +(l.x / bgImg.offsetWidth).toFixed(4),
      y_pct: +(l.y / bgImg.offsetHeight).toFixed(4),
      w_pct: +(l.w / bgImg.offsetWidth).toFixed(4),
      h_pct: +(l.h / bgImg.offsetHeight).toFixed(4),
    }))
  };
  return JSON.stringify(data, null, 2);
}

document.getElementById('btn-export').addEventListener('click', () => {
  jsonOut.value = exportLayout();
});
document.getElementById('btn-copy').addEventListener('click', () => {
  const txt = exportLayout();
  jsonOut.value = txt;
  navigator.clipboard.writeText(txt).catch(() => { jsonOut.select(); document.execCommand('copy'); });
});

// keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (!selectedId) return;
  const layer = layers.find(l => l.id === selectedId);
  if (!layer) return;
  const step = e.shiftKey ? 10 : 1;
  if (e.key === 'ArrowLeft') { layer.x -= step; layer.el.style.left = layer.x + 'px'; updatePropsPanel(); e.preventDefault(); }
  if (e.key === 'ArrowRight') { layer.x += step; layer.el.style.left = layer.x + 'px'; updatePropsPanel(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { layer.y -= step; layer.el.style.top = layer.y + 'px'; updatePropsPanel(); e.preventDefault(); }
  if (e.key === 'ArrowDown') { layer.y += step; layer.el.style.top = layer.y + 'px'; updatePropsPanel(); e.preventDefault(); }
  if (e.key === 'Delete' || e.key === 'Backspace') { deleteLayer(selectedId); e.preventDefault(); }
});
</script>
</body>
</html>
