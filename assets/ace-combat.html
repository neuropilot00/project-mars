<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACE COMBAT DEMO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02040a;
      color: #e8fff6;
      font-family: Consolas, Monaco, "Courier New", monospace;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(0, 255, 190, 0.6);
    }

    .panel {
      position: absolute;
      min-width: 210px;
      padding: 12px 14px;
      border: 1px solid rgba(102, 255, 213, 0.36);
      border-radius: 6px;
      background: rgba(0, 10, 18, 0.62);
      box-shadow: 0 0 24px rgba(0, 255, 220, 0.08) inset;
      backdrop-filter: blur(4px);
    }

    #leftPanel {
      top: 18px;
      left: 18px;
    }

    #rightPanel {
      top: 18px;
      right: 18px;
      text-align: right;
    }

    #weaponPanel {
      right: 18px;
      bottom: 18px;
      width: 285px;
      font-size: 13px;
      line-height: 1.55;
    }

    .barBlock {
      margin: 0 0 10px;
    }

    .barBlock:last-child {
      margin-bottom: 0;
    }

    .labelRow {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 5px;
      font-size: 13px;
      letter-spacing: 0;
      color: #d8fff6;
    }

    .barShell {
      width: 190px;
      height: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.08);
    }

    .barFill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transition: width 80ms linear;
    }

    #shieldFill {
      background: linear-gradient(90deg, #22f6ff, #8affff);
      box-shadow: 0 0 12px rgba(34, 246, 255, 0.8);
    }

    #hullFill {
      background: linear-gradient(90deg, #39ff83, #d4ff69);
      box-shadow: 0 0 12px rgba(57, 255, 131, 0.8);
    }

    #boostFill {
      background: linear-gradient(90deg, #ffe15d, #ff8e3c);
      box-shadow: 0 0 12px rgba(255, 197, 70, 0.8);
    }

    .readout {
      margin-top: 4px;
      color: #b7fff0;
      font-size: 14px;
    }

    #lockWrap {
      position: absolute;
      left: 50%;
      bottom: 74px;
      width: 136px;
      height: 136px;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 90ms linear;
    }

    #lockCircle {
      position: absolute;
      inset: 18px;
      border: 2px solid rgba(0, 255, 206, 0.7);
      border-radius: 50%;
      box-shadow: 0 0 18px rgba(0, 255, 206, 0.35), inset 0 0 18px rgba(0, 255, 206, 0.18);
    }

    #lockProgress {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background:
        conic-gradient(rgba(255, 220, 64, 0.95) 0deg, rgba(255, 220, 64, 0.95) 0deg, transparent 0deg),
        radial-gradient(circle, transparent 62%, rgba(0, 255, 206, 0.18) 63%, transparent 67%);
      opacity: 0.95;
    }

    #lockText {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      text-align: center;
      font-size: 13px;
      color: #ffffff;
    }

    #centerMessage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 26px;
      pointer-events: auto;
      cursor: pointer;
      background: radial-gradient(circle at center, rgba(0, 35, 46, 0.18), rgba(0, 0, 0, 0.28) 58%, rgba(0, 0, 0, 0.62));
      text-align: center;
      color: #ffffff;
    }

    #centerMessage.hidden {
      display: none;
    }

    #messageTitle {
      font-size: clamp(28px, 5vw, 72px);
      line-height: 1.05;
      letter-spacing: 0;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 255, 220, 0.92), 0 0 50px rgba(0, 126, 255, 0.42);
    }

    #messageSub {
      margin-top: 18px;
      font-size: clamp(14px, 1.7vw, 22px);
      color: #9dffe8;
    }

    #flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: #ffffff;
      opacity: 0;
      transition: opacity 100ms linear;
    }

    /* boost speed-lines: cosmetic radial vignette streaks, opacity-toggled (cheap) */
    #speedLines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 140ms linear;
      background:
        radial-gradient(ellipse 60% 55% at 50% 50%, transparent 40%, rgba(125, 255, 240, 0.12) 100%),
        repeating-conic-gradient(from 0deg at 50% 50%,
          rgba(255, 255, 255, 0.10) 0deg, rgba(255, 255, 255, 0) 1.2deg 8deg);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 34%, #000 78%);
      mask-image: radial-gradient(circle at 50% 50%, transparent 34%, #000 78%);
    }

    /* ── on-screen touch controls (feature 2): pointer-events isolated; HUD root stays none ── */
    #aceTouch {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      display: none;            /* shown only on touch devices (JS sets display:block) */
    }

    #aceTouch.on {
      display: block;
    }

    #ace-stick {
      position: absolute;
      left: 20px;
      bottom: 20px;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      border: 2px solid rgba(102, 255, 213, 0.4);
      background: rgba(0, 14, 22, 0.42);
      pointer-events: auto;
      touch-action: none;
    }

    #ace-stick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: rgba(102, 255, 213, 0.55);
      box-shadow: 0 0 16px rgba(0, 255, 206, 0.5);
      pointer-events: none;
    }

    .ace-btn {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(102, 255, 213, 0.45);
      background: rgba(0, 14, 22, 0.5);
      color: #d8fff6;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0;
      pointer-events: auto;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .ace-btn:active {
      background: rgba(102, 255, 213, 0.3);
    }

    /* right action cluster — kept clear of #weaponPanel (which shrinks/raises in the media query below) */
    #ace-fire   { right: 24px;  bottom: 150px; width: 78px; height: 78px; }
    #ace-lock   { right: 110px; bottom: 96px; }
    #ace-boost  { right: 24px;  bottom: 246px; }
    #ace-uturn  { right: 110px; bottom: 178px; }
    #ace-roll   { right: 196px; bottom: 96px; }
    #ace-brake  { right: 196px; bottom: 178px; }
    #ace-view   { top: 18px; left: 50%; margin-left: -32px; }

    @media (max-width: 720px) {
      .panel {
        min-width: 170px;
        padding: 9px 10px;
      }

      .barShell {
        width: 150px;
      }

      /* on mobile the bottom corners host the stick (left) + action cluster (right);
         move the weapon readout to top-center so nothing overlaps the controls. */
      #weaponPanel {
        width: auto;
        min-width: 0;
        max-width: 60vw;
        font-size: 10px;
        line-height: 1.35;
        padding: 5px 8px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        top: 90px;
        bottom: auto;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="leftPanel" class="panel">
      <div class="barBlock">
        <div class="labelRow"><span>SHIELD</span><span id="shieldText">100</span></div>
        <div class="barShell"><div id="shieldFill" class="barFill"></div></div>
      </div>
      <div class="barBlock">
        <div class="labelRow"><span>HULL</span><span id="hullText">100</span></div>
        <div class="barShell"><div id="hullFill" class="barFill"></div></div>
      </div>
    </div>

    <div id="rightPanel" class="panel">
      <div class="barBlock">
        <div class="labelRow"><span>BOOST</span><span id="boostText">100</span></div>
        <div class="barShell"><div id="boostFill" class="barFill"></div></div>
      </div>
      <div class="readout">ENEMIES <span id="enemyText">12</span></div>
    </div>

    <div id="weaponPanel" class="panel">
      <div>PLASMA: <span id="plasmaText">READY</span></div>
      <div>MISSILE: <span id="missileText">READY</span></div>
      <div>LOCK: <span id="lockStatusText">NO TARGET</span></div>
    </div>

    <div id="lockWrap">
      <div id="lockProgress"></div>
      <div id="lockCircle"></div>
      <div id="lockText">LOCKING</div>
    </div>

    <div id="centerMessage">
      <div>
        <div id="messageTitle">ACE COMBAT DEMO</div>
        <div id="messageSub">PRESS ENTER TO START</div>
      </div>
    </div>
  </div>
  <div id="aceTouch">
    <div id="ace-stick"><div id="ace-stick-knob"></div></div>
    <button type="button" id="ace-fire"  class="ace-btn" data-act="fire">FIRE</button>
    <button type="button" id="ace-lock"  class="ace-btn" data-act="lock">LOCK</button>
    <button type="button" id="ace-boost" class="ace-btn" data-act="boost">BOOST</button>
    <button type="button" id="ace-uturn" class="ace-btn" data-act="uturn">U-TURN</button>
    <button type="button" id="ace-roll"  class="ace-btn" data-act="roll">ROLL</button>
    <button type="button" id="ace-brake" class="ace-btn" data-act="brake">BRAKE</button>
    <button type="button" id="ace-view"  class="ace-btn" data-act="view">3RD</button>
  </div>
  <div id="speedLines"></div>
  <div id="flash"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script>
    (function () {
      "use strict";

      const WORLD_RADIUS = 800;
      const BASE_SPEED = 40;
      const BOOST_MULT = 1.8;
      const BRAKE_MULT = 0.3;
      const TURN_LERP = 0.06;       // demo default; overridden by profile
      const CAMERA_LERP = 0.08;
      const ENEMY_COUNT = 12;
      const PLAYER_SHOT_SPEED = 300;
      const ENEMY_SHOT_SPEED = 155;
      const MISSILE_SPEED = 175;
      const MISSILE_TURN = 0.105;
      const LOCK_RANGE = 300;       // demo default; overridden by profile
      const LOCK_TIME = 1.5;        // demo default; overridden by profile

      // ── PERF flag: mobile / low-power detection (density scaling only; controls/camera unchanged) ──
      const PERF = (function () {
        try {
          var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
          var narrow = (window.innerWidth || 0) <= 820;
          var touch = ("ontouchstart" in window) || (navigator.maxTouchPoints || 0) > 0;
          return !!(coarse || narrow || touch);
        } catch (_) { return false; }
      })();
      // density multipliers applied only to visual cost (particles/starfield/trails), never to gameplay logic.
      const FX = {
        starCount: PERF ? 900 : 2000,
        explosionMult: PERF ? 0.5 : 1,
        trailDensity: PERF ? 0.35 : 1,   // probability scale for cosmetic enemy trails
        enemyTrailMax: PERF ? 1 : 3,     // cosmetic enemy trail segments per frame
        vfxGlow: !PERF,                  // feature 4: outer glow planes on heavy/turbolaser bolts (off on PERF)
        boltLifeMult: PERF ? 0.7 : 1     // feature 4: shorten additive streak lifetime on PERF
      };
      // ── TOUCH: coarse-pointer / touch device gate for the on-screen control layer ──
      const TOUCH = (function () {
        try {
          var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
          var touch = ("ontouchstart" in window) || (navigator.maxTouchPoints || 0) > 0;
          return !!(coarse || touch);
        } catch (_) { return false; }
      })();

      // ── Asset path (this file is served from /assets/, so use absolute /assets/ships/) ──
      const SHIP_TEX_BASE = "/assets/ships/";
      const DEMO_ENEMY_CODES = ["mcc_int", "mcc_frg", "fsp_int", "fsp_dst"];
      const DEMO_PLAYER_CODE = "mcc_dst";

      // ── URL bootstrap (mirrors tactical-lab contract) ──
      const QS = new URLSearchParams(location.search);
      const BOOT = {
        mode: (QS.get("mode") || "demo").toLowerCase(),
        bid: (function () { var n = parseInt(QS.get("bid"), 10); return n > 0 ? n : 0; })(),
        wallet: (QS.get("wallet") || "").toLowerCase(),
        lang: QS.get("lang") || "en"
      };
      // bid invalid/<=0 → demote to demo
      if (BOOT.mode === "battle" && !BOOT.bid) BOOT.mode = "demo";
      if (BOOT.bid) BOOT.mode = "battle";

      // ── size_class derivation from ship_type_code ──
      // Suffix → size_class table. Pilgrim assembled hulls handled separately.
      function sizeClassFromCode(code) {
        if (!code) return "destroyer";
        var c = String(code).toLowerCase();
        if (c.indexOf("pilgrim_") === 0) return "assembled";
        if (/_titan$/.test(c)) return "titan";
        if (/_bs$/.test(c)) return "battleship";
        if (/_crs$/.test(c) || /_snp$/.test(c) || /_logi_crs$/.test(c)) return "cruiser";
        if (/_dst$/.test(c)) return "destroyer";
        if (/_int$/.test(c) || /_frg$/.test(c) || /_ewar$/.test(c) || /_logi$/.test(c) || /_bomb$/.test(c)) return "frigate";
        return "destroyer";
      }

      function factionFromCode(code) {
        if (!code) return "mcc";
        var c = String(code).toLowerCase();
        var p = c.split("_")[0];
        if (p === "mcc" || p === "fsp" || p === "cv" || p === "pilgrim") return p;
        return "mcc";
      }

      // ── size_class view profiles (camera/FOV/speed/turn/weapon/control) ──
      const VIEW_PROFILES = {
        frigate: {
          camDist: 12, camHeight: 5, fov: 82, speedMult: 1.6, boostMult: 1.85,
          turnLerp: 0.10, pitchRate: 1.5, yawRate: 1.4, rollBank: 0.7,
          plasmaCool: 0.10, plasmaDmg: 1, plasmaOffset: 3.2, missileCool: 3.0,
          lockTime: 1.2, lockRange: 280, missileDmg: 3, playerHull: 100,
          beam: false, label: "FRIGATE / COCKPIT"
        },
        destroyer: {
          camDist: 46, camHeight: 14, fov: 74, speedMult: 1.15, boostMult: 1.8,
          turnLerp: 0.07, pitchRate: 1.18, yawRate: 1.08, rollBank: 0.62,
          plasmaCool: 0.15, plasmaDmg: 1, plasmaOffset: 4.6, missileCool: 4.0,
          lockTime: 1.5, lockRange: 320, missileDmg: 3, playerHull: 110,
          beam: false, label: "DESTROYER / CHASE"
        },
        cruiser: {
          camDist: 68, camHeight: 21, fov: 70, speedMult: 0.95, boostMult: 1.6,
          turnLerp: 0.05, pitchRate: 0.95, yawRate: 0.85, rollBank: 0.5,
          plasmaCool: 0.22, plasmaDmg: 2, plasmaOffset: 6, missileCool: 4.5,
          lockTime: 1.6, lockRange: 430, missileDmg: 4, playerHull: 140,
          beam: false, label: "CRUISER / LONG CHASE"
        },
        battleship: {
          camDist: 100, camHeight: 32, fov: 66, speedMult: 0.8, boostMult: 1.45,
          turnLerp: 0.035, pitchRate: 0.7, yawRate: 0.6, rollBank: 0.34,
          plasmaCool: 0.30, plasmaDmg: 3, plasmaOffset: 8, missileCool: 5.0,
          lockTime: 1.8, lockRange: 480, missileDmg: 5, playerHull: 200,
          beam: true, beamCharge: 1.1, label: "BATTLESHIP / WIDE CHASE"
        },
        titan: {
          camDist: 145, camHeight: 95, fov: 60, speedMult: 0.6, boostMult: 1.25,
          turnLerp: 0.025, pitchRate: 0.5, yawRate: 0.45, rollBank: 0.22,
          plasmaCool: 0.35, plasmaDmg: 4, plasmaOffset: 10, missileCool: 5.5,
          lockTime: 2.0, lockRange: 600, missileDmg: 6, playerHull: 280,
          beam: true, beamCharge: 1.0, label: "TITAN / COMMAND"
        },
        assembled: {
          camDist: 108, camHeight: 36, fov: 64, speedMult: 0.78, boostMult: 1.4,
          turnLerp: 0.04, pitchRate: 0.75, yawRate: 0.65, rollBank: 0.34,
          plasmaCool: 0.26, plasmaDmg: 3, plasmaOffset: 8, missileCool: 5.0,
          lockTime: 1.7, lockRange: 500, missileDmg: 5, playerHull: 210,
          beam: true, beamCharge: 1.05, label: "ASSEMBLED / WIDE CHASE"
        }
      };

      // ── per-size_class billboard scale (shared by player + enemy; feature 3) ──
      const CLASS_SCALE = {
        frigate: 1.0, destroyer: 1.4, cruiser: 2.0,
        battleship: 3.2, titan: 5.0, assembled: 3.0
      };
      function classScale(code) {
        return CLASS_SCALE[sizeClassFromCode(code)] || 1.4;
      }

      // ── faction → projectile/beam color (feature 4; cosmetic only) ──
      const FACTION_COLOR = {
        mcc: 0x33ffe0,      // cyan-teal
        fsp: 0x39ff83,      // green
        cv:  0xff3322,      // red
        pilgrim: 0xb060ff   // violet
      };
      function factionColor(code) {
        return FACTION_COLOR[factionFromCode(code)] || FACTION_COLOR.mcc;
      }
      // brighter core companion for a given faction bolt (lerp toward white)
      function boltCoreColor(baseColor) {
        return new THREE.Color(baseColor).lerp(new THREE.Color(0xffffff), 0.55).getHex();
      }

      // ── size_class → weapon tier (feature 4): drives bolt geometry / streak / beam ──
      // blaster (frigate), heavy_bolt (cruiser), turbolaser (battleship),
      // charge_beam (titan), hybrid (assembled). destroyer keeps a mid blaster.
      const WEAPON_TIER = {
        frigate: "blaster",
        destroyer: "blaster",
        cruiser: "heavy_bolt",
        battleship: "turbolaser",
        titan: "charge_beam",
        assembled: "hybrid"
      };
      function weaponTier(code) {
        return WEAPON_TIER[sizeClassFromCode(code)] || "blaster";
      }

      // ── faction flavor (small, balance-preserving nudges) ──
      const FACTION_FLAVOR = {
        mcc: { lockTimeMult: 0.85, lockRangeMult: 1.12, hullMult: 1.0, shieldRegenMult: 1.0, plasmaCoolMult: 1.0 },
        fsp: { lockTimeMult: 1.05, lockRangeMult: 1.0, hullMult: 1.2, shieldRegenMult: 1.5, plasmaCoolMult: 1.0 },
        cv:  { lockTimeMult: 1.0, lockRangeMult: 1.0, hullMult: 0.85, shieldRegenMult: 1.0, plasmaCoolMult: 0.7 },
        pilgrim: { lockTimeMult: 0.95, lockRangeMult: 1.05, hullMult: 1.05, shieldRegenMult: 1.1, plasmaCoolMult: 0.9 }
      };

      // Active profile — defaults to demo (destroyer / mcc). Resolved before init() runs in battle mode.
      let PROFILE = Object.assign({}, VIEW_PROFILES.destroyer);
      // feature 4: demo-default weapon VFX descriptors (overwritten by resolveProfile in battle mode).
      PROFILE.tier = weaponTier(DEMO_PLAYER_CODE);
      PROFILE.boltColor = factionColor(DEMO_PLAYER_CODE);
      PROFILE.beamColor = boltCoreColor(PROFILE.boltColor);
      let PLAYER_CODE = DEMO_PLAYER_CODE;
      let ENEMY_CODES = DEMO_ENEMY_CODES.slice();
      let ENEMY_SPAWN_COUNT = ENEMY_COUNT;

      function applyFlavor(profile, faction) {
        var fl = FACTION_FLAVOR[faction] || FACTION_FLAVOR.mcc;
        var p = Object.assign({}, profile);
        p.lockTime = profile.lockTime * fl.lockTimeMult;
        p.lockRange = profile.lockRange * fl.lockRangeMult;
        p.playerHull = Math.round(profile.playerHull * fl.hullMult);
        p.shieldRegenMult = fl.shieldRegenMult;
        p.plasmaCool = profile.plasmaCool * fl.plasmaCoolMult;
        return p;
      }

      function resolveProfile(playerCode) {
        var sc = sizeClassFromCode(playerCode);
        var fac = factionFromCode(playerCode);
        var base = VIEW_PROFILES[sc] || VIEW_PROFILES.destroyer;
        PROFILE = applyFlavor(base, fac);
        PLAYER_CODE = playerCode;
        // feature 4: cache weapon VFX descriptors on the active profile (cosmetic only).
        PROFILE.tier = weaponTier(playerCode);
        PROFILE.boltColor = factionColor(playerCode);
        PROFILE.beamColor = boltCoreColor(PROFILE.boltColor);
      }

      // ── parent postMessage stub (mirrors tactical-lab pattern) ──
      function notifyParent(cmd, payload) {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              source: "ace-combat",
              cmd: cmd,
              battleId: BOOT.bid || null,
              wallet: BOOT.wallet || null,
              payload: payload || {}
            }, location.origin);
          }
        } catch (_) {}
      }

      // ── fleet-presets fetch (read-only; battle mode only) ──
      // Resolves player code + enemy codes from the real battle composition, then boots.
      function bootstrapAndStart() {
        if (BOOT.mode !== "battle" || !BOOT.bid) {
          // demo: keep existing behavior
          notifyParent("ready", { mode: "demo" });
          init();
          return;
        }
        fetch("/api/tactical-lab/fleet-presets?bid=" + BOOT.bid, { headers: { "Accept": "application/json" } })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            try {
              if (data && (data.atk || data.def)) {
                var atk = data.atk || [];
                var def = data.def || [];
                // Player = atk[0] flagship (the battle's primary attacker fleet).
                var myFlag = atk[0] && atk[0].flagship;
                if (myFlag) resolveProfile(myFlag);
                // Enemy = def side composition (flagship + escort codes). Fallback to atk overflow.
                var enemyCodes = [];
                var src = def.length ? def : atk.slice(1);
                src.forEach(function (f) {
                  if (f.flagship) enemyCodes.push(f.flagship);
                  if (f.escort) Object.keys(f.escort).forEach(function (c) { enemyCodes.push(c); });
                });
                if (enemyCodes.length) {
                  ENEMY_CODES = enemyCodes;
                  // scale spawn count with composition breadth (clamped)
                  ENEMY_SPAWN_COUNT = Math.max(6, Math.min(18, enemyCodes.length + 4));
                }
              }
            } catch (_) {}
            notifyParent("ready", { mode: "battle", bid: BOOT.bid, playerCode: PLAYER_CODE });
            init();
          })
          .catch(function () {
            // network/parse failure → fall back to demo enemies but keep mode tag
            notifyParent("ready", { mode: "battle", bid: BOOT.bid, fallback: true });
            init();
          });
      }

      function init() {
        try {
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x02040a, 0.00075);

      const hud = {

      let state = "titleScreen";

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));

      function setFlashColor(opacity, color) {
        try {
          hud.flash.style.background = color || "#ffffff";
          hud.flash.style.opacity = String(opacity);
          if (_flashColorTimer) window.clearTimeout(_flashColorTimer);

      // ── lightweight WebAudio cue (no external assets; lazy + autoplay-safe) ──
      let _audioCtx = null;
      function audioCtx() {
        if (_audioCtx === false) return null;
        if (_audioCtx) return _audioCtx;
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) { _audioCtx = false; return null; }
          _audioCtx = new AC();
          return _audioCtx;
        } catch (_) { _audioCtx = false; return null; }
      }
      function playTone(freq, dur, type, gainPeak) {
        var ctx = audioCtx();
        if (!ctx) return;
        try {
          if (ctx.state === "suspended" && ctx.resume) ctx.resume();
          var osc = ctx.createOscillator();
          var g = ctx.createGain();
          osc.type = type || "sine";
          osc.frequency.value = freq;
          var now = ctx.currentTime;
          var peak = gainPeak == null ? 0.05 : gainPeak;
          g.gain.setValueAtTime(0.0001, now);
          g.gain.exponentialRampToValueAtTime(peak, now + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          osc.connect(g); g.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + dur + 0.02);
        } catch (_) {}
      }

      // ── transient hit-marker (small X) shown center-screen on confirmed enemy hit ──

          "transition:opacity 90ms linear"
        ].join(";");
        document.body.appendChild(el);

      // ── plasma muzzle flash: short-lived additive sprite at the muzzle ──
      let muzzleFlashes = [];
      function spawnMuzzleFlash(position, color) {
        const geo = new THREE.PlaneGeometry(7, 7);
        const mat = new THREE.MeshBasicMaterial({
          color: color || 0x7dfff0,
          transparent: true,
          opacity: 0.9,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(position);
        scene.add(mesh);
        muzzleFlashes.push({ mesh, life: 0.08, maxLife: 0.08 });
      }
      function updateMuzzleFlashes(dt) {
        for (let i = muzzleFlashes.length - 1; i >= 0; i -= 1) {
          const mf = muzzleFlashes[i];
          mf.life -= dt;
          const t = Math.max(0, mf.life / mf.maxLife);
          mf.mesh.material.opacity = t * 0.9;
          mf.mesh.scale.setScalar(1 + (1 - t) * 1.6);
          mf.mesh.quaternion.copy(camera.quaternion); // billboard
          if (mf.life <= 0) {
            scene.remove(mf.mesh);
            muzzleFlashes.splice(i, 1);
          }
        }
      }

      function randomDirection() {
        return new THREE.Vector3(rand(-1, 1), rand(-0.6, 0.6), rand(-1, 1)).normalize();

      function createStarfield() {
        const starCount = FX.starCount;
        const positions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i += 1) {
          const d = rand(300, 1600);
          const dir = randomDirection();
          positions[i * 3] = dir.x * d;
          positions[i * 3 + 1] = dir.y * d;
          positions[i * 3 + 2] = dir.z * d;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({

        });

      function addBoundaryShell() {

        });

      let _enemyTexCache = {};

      function shipTexPath(code) {
        return SHIP_TEX_BASE + code + ".png";
      }

      // feature 6: per-view texture chains. 0 NEW ASSETS — ace/*_rear & ace/*_front need NOT exist;
      // the chain transparently falls through to ships/CODE.png today, auto-upgrading if art is added.
      function playerTexPaths(code) {
        // REAR view (3rd person shows our tail): ace rear → ships/CODE → mcc_dst.
        return [
          SHIP_TEX_BASE + "ace/" + code + "_rear.png",
          shipTexPath(code),
          SHIP_TEX_BASE + "mcc_dst.png"
        ];
      }
      function enemyTexPaths(code) {
        // FRONT view (enemies fly toward us / lookAt player): ace front → ships/CODE → mcc_dst.
        return [
          SHIP_TEX_BASE + "ace/" + code + "_front.png",
          shipTexPath(code),
          SHIP_TEX_BASE + "mcc_dst.png"
        ];
      }

      // 멀티스테이지 폴백 로더: paths 순서대로 시도, onError마다 다음 후보로. 마지막까지 실패해도 조용히 멈춤.
      // 콘솔 스팸 방지: 실패는 onError 콜백에서만 처리, 해상된 텍스처는 첫 path 키로 캐시(아래 getEnemyTex).
      function loadShipTexChain(paths) {
        const loader = new THREE.TextureLoader();
        const list = (paths && paths.length) ? paths.slice() : [SHIP_TEX_BASE + "mcc_dst.png"];
        // first stage loads into `tex`; later stages copy their image into the same texture object.
        const tex = new THREE.Texture();
        function tryNext(i) {
          if (i >= list.length) return; // exhausted — leave last successful image (or empty) silently
          loader.load(
            list[i],
            function (loaded) {
              tex.image = loaded.image;
              tex.needsUpdate = true;
            },
            undefined,
            function () { tryNext(i + 1); }
          );
        }
        tryNext(0);
        return tex;
      }

      function getEnemyTex(index) {
        const codes = (ENEMY_CODES && ENEMY_CODES.length) ? ENEMY_CODES : DEMO_ENEMY_CODES;
        const code = codes[index % codes.length];
        const paths = enemyTexPaths(code);
        const key = paths[0]; // cache by first-path key so the 404 chain runs once per code, not per enemy
        if (!_enemyTexCache[key]) _enemyTexCache[key] = loadShipTexChain(paths);
        return _enemyTexCache[key];
      }

      function makePlayer() {
        const root = new THREE.Group();
        const tex = loadShipTexChain(playerTexPaths(PLAYER_CODE));
        const geo = new THREE.PlaneGeometry(28, 36);

          mesh: root,
          hullMesh: mesh,

      function makeEnemy(index) {
        const mesh = new THREE.Group();

      function resetCollections() {
        const all = enemies.concat(playerShots, enemyShots, missiles, explosions.map(e => e.points), trails.map(t => t.mesh), muzzleFlashes.map(m => m.mesh));
        for (const item of all) {

          else if (item) scene.remove(item);

        enemies = [];
        playerShots = [];
        enemyShots = [];
        missiles = [];
        explosions = [];
        trails = [];

      function resetGame() {

        camera.updateProjectionMatrix();

        setState("gameplay");

      // ── ACE honor result payload (cosmetic; server is the source of truth via clamp) ──
      function aceResultPayload(outcome) {
        var dur = aceStart ? Math.round((Date.now() - aceStart) / 1000) : 0;
        if (!(dur >= 0)) dur = 0;
        return {
          outcome: outcome,
          playerCode: PLAYER_CODE,
          kills: aceKills,
          durationSec: dur,

      function setState(nextState) {
        state = nextState;
        if (nextState === "titleScreen") {
          hud.centerMessage.classList.remove("hidden");

          hud.messageTitle.textContent = BOOT.mode === "battle" ? "ACE COMBAT" : "ACE COMBAT DEMO";
          hud.messageSub.innerHTML = (PROFILE.label || "DESTROYER / CHASE") +

          notifyParent("ace_result", aceResultPayload("win"));

          hud.centerMessage.classList.remove("hidden");

          notifyParent("ace_result", aceResultPayload("loss"));

          hud.centerMessage.onclick = null;

      function makeProjectile(position, direction, color, speed, owner) {
        const geo = new THREE.CylinderBufferGeometry(0.55, 0.55, owner === "player" ? 8 : 5, 8);
        geo.rotateX(Math.PI / 2);
        const mat = new THREE.MeshBasicMaterial({ color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(position);
        mesh.quaternion.setFromUnitVectors(forwardVec, direction.clone().normalize());
        scene.add(mesh);
        return {
          mesh,
          velocity: direction.clone().normalize().multiplyScalar(speed),
          life: owner === "player" ? 2.1 : 4.2,
          owner
        };
      }

      // feature 4: tiered player bolt. Star-Wars additive billboard streak (camera-billboarded each
      // frame in updateProjectiles via shot.billboard), faction-tinted, with an oriented core cylinder.
      // tier ∈ blaster | heavy_bolt | turbolaser | hybrid. (titan charge_beam is a separate beam mesh.)
      const TIER_BOLT = {
        blaster:    { len: 9,  width: 1.3, coreR: 0.5,  glow: false, life: 1.9 },
        heavy_bolt: { len: 16, width: 2.0, coreR: 0.75, glow: true,  life: 2.1 },
        turbolaser: { len: 30, width: 3.2, coreR: 1.1,  glow: true,  life: 2.4 },
        hybrid:     { len: 18, width: 2.2, coreR: 0.85, glow: true,  life: 2.1 }
      };
      function makeBolt(tier, color, position, direction, speed) {
        const spec = TIER_BOLT[tier] || TIER_BOLT.blaster;
        const dir = direction.clone().normalize();
        const grp = new THREE.Group();

        // oriented core cylinder (bright lerped color, solid)
        const coreGeo = new THREE.CylinderBufferGeometry(spec.coreR, spec.coreR, spec.len * 0.55, 8);
        coreGeo.rotateX(Math.PI / 2);
        const coreMesh = new THREE.Mesh(coreGeo, new THREE.MeshBasicMaterial({ color: boltCoreColor(color) }));
        coreMesh.quaternion.setFromUnitVectors(forwardVec, dir);
        grp.add(coreMesh);

        // additive billboard streak (faction-tinted, camera-facing, depthWrite off)
        const streakGeo = new THREE.PlaneGeometry(spec.width, spec.len);
        const streakMat = new THREE.MeshBasicMaterial({
          color: color,
          transparent: true,
          opacity: 0.95,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide
        });
        const streak = new THREE.Mesh(streakGeo, streakMat);
        grp.add(streak);

        // optional outer glow plane (heavy/turbolaser/hybrid) — skipped on PERF
        let glow = null;
        if (spec.glow && FX.vfxGlow) {
          const glowMat = new THREE.MeshBasicMaterial({
            color: color,
            transparent: true,
            opacity: 0.4,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide
          });
          glow = new THREE.Mesh(new THREE.PlaneGeometry(spec.width * 2.4, spec.len * 1.15), glowMat);
          grp.add(glow);
        }

        grp.position.copy(position);
        scene.add(grp);
        return {
          mesh: grp,
          velocity: dir.multiplyScalar(speed),
          life: spec.life * FX.boltLifeMult,
          owner: "player",
          billboard: true,
          streak: streak,
          glow: glow,
          streakLen: spec.len,
          dir: dir.clone()
        };
      }

      function firePlasma(time) {
        if (state !== "gameplay") return;
        // titan charge_beam fires as a continuous beam (driven in updateChargeBeam while held), not bolts.
        if (PROFILE.tier === "charge_beam") return;
        if (time - lastShotTime < PROFILE.plasmaCool) return;
        lastShotTime = time;
        const forward = forwardVec.clone().applyQuaternion(player.mesh.quaternion).normalize();
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(player.mesh.quaternion).normalize();
        const origin = player.mesh.position.clone().add(forward.clone().multiplyScalar(-11));
        const off = PROFILE.plasmaOffset;
        const tier = PROFILE.tier || "blaster";
        const color = PROFILE.boltColor || 0x33ffe0;
        const muzzleColor = boltCoreColor(color);
        // small classes keep twin emitters; turbolaser fires one fat central streak (Star-Wars look).
        const offsets = (tier === "turbolaser") ? [0] : [-off, off];
        // hybrid: intermittent short beam pulse alongside heavy bolts.
        const hybridPulse = (tier === "hybrid") && (Math.random() < 0.4);
        for (const offset of offsets) {
          const pos = origin.clone().add(right.clone().multiplyScalar(offset));
          const shot = makeBolt(hybridPulse ? "turbolaser" : tier, color, pos, forward, PLAYER_SHOT_SPEED);
          playerShots.push(shot);
          spawnMuzzleFlash(pos, muzzleColor);
        }
        const toneHz = (tier === "turbolaser") ? 420 : (tier === "heavy_bolt" || tier === "hybrid") ? 520 : 660;
        playTone(toneHz, 0.06, "square", 0.035);
      }

      // ── feature 4: titan charge beam. Continuous additive quad nose→range while fire held + beam class.
      // Damage via segment-distance against enemies (the one new collision path; PERF-capped length/glow).
      let _beam = null; // { core, glow }
      function ensureBeam() {
        if (_beam) return _beam;
        const color = PROFILE.boltColor || 0x33ffe0;
        const coreMat = new THREE.MeshBasicMaterial({
          color: boltCoreColor(color), transparent: true, opacity: 0.95,
          depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
        });
        const core = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), coreMat);
        core.visible = false;
        scene.add(core);
        let glow = null;
        if (FX.vfxGlow) {
          const glowMat = new THREE.MeshBasicMaterial({
            color: color, transparent: true, opacity: 0.45,
            depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
          });
          glow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), glowMat);
          glow.visible = false;
          scene.add(glow);
        }
        _beam = { core: core, glow: glow };
        return _beam;
      }
      function hideBeam() {
        if (!_beam) return;
        _beam.core.visible = false;
        if (_beam.glow) _beam.glow.visible = false;
      }
      function updateChargeBeam(dt, time) {
        if (PROFILE.tier !== "charge_beam") { hideBeam(); return; }
        const firing = (state === "gameplay") && (keys.Space || touchKeys.fire) && player && player.alive;
        if (!firing) { hideBeam(); return; }
        const beam = ensureBeam();
        const forward = forwardVec.clone().applyQuaternion(player.mesh.quaternion).normalize();
        const origin = player.mesh.position.clone().add(forward.clone().multiplyScalar(-11));
        const maxLen = PERF ? 520 : 760; // PERF-capped beam reach
        const beamW = 4.5;
        // segment-distance hit detection + find effective beam end (first hit or max range)
        let endDist = maxLen;
        let didHit = false;
        for (const enemy of enemies) {
          if (!enemy.alive) continue;
          const toE = enemy.mesh.position.clone().sub(origin);
          const along = toE.dot(forward);
          if (along < 0 || along > maxLen) continue;
          const perp = toE.clone().sub(forward.clone().multiplyScalar(along)).length();
          const hitR = 10 * (enemy.scale || 1);
          if (perp < hitR) {
            // continuous DPS while beam dwells on target
            enemy.hp -= (PROFILE.plasmaDmg * 4) * dt;
            if (enemy.hp <= 0) destroyEnemy(enemy);
            didHit = true;
            if (along < endDist) endDist = along;
          }
        }
        const mid = origin.clone().add(forward.clone().multiplyScalar(endDist / 2));
        function orientQuad(q, w) {
          q.visible = true;
          q.position.copy(mid);
          q.scale.set(w, endDist, 1);
          // billboard toward camera, long axis (local +Y) along forward in screen space
          const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
          const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
          const roll = Math.atan2(forward.dot(camRight), forward.dot(camUp));
          q.quaternion.copy(camera.quaternion);
          q.rotateZ(-roll);
        }
        orientQuad(beam.core, beamW);
        if (beam.glow) orientQuad(beam.glow, beamW * 2.6);
        // throttle per-frame flashes (esp. on PERF) so the continuous beam stays cheap.
        const flashChance = PERF ? 0.25 : 0.6;
        if (didHit) {
          if (Math.random() < flashChance) {
            spawnMuzzleFlash(origin.clone().add(forward.clone().multiplyScalar(endDist)), PROFILE.beamColor || 0xffffff);
          }
          showHitMarker();
        }
        if (Math.random() < flashChance) spawnMuzzleFlash(origin, PROFILE.beamColor || 0xffffff);
      }

      function findNearestLockTarget() {
        let nearest = null;
        let nearestDist = PROFILE.lockRange;
        for (const enemy of enemies) {
          if (!enemy.alive) continue;
          const dist = enemy.mesh.position.distanceTo(player.mesh.position);
          if (dist < nearestDist) {
            nearest = enemy;
            nearestDist = dist;
          }
        }
        return nearest;
      }

      function fireMissile(target) {
        if (!target || missileCooldown > 0) return;
        // feature 4: proton torpedo — brighter additive core sphere, faction-tinted, slightly enlarged.
        const torpColor = PROFILE.boltColor || 0xffe65a;
        const geo = new THREE.SphereBufferGeometry(2.6, 16, 12);
        const mat = new THREE.MeshBasicMaterial({
          color: boltCoreColor(torpColor),
          transparent: true,
          opacity: 0.98,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const mesh = new THREE.Mesh(geo, mat);
        const forward = forwardVec.clone().applyQuaternion(player.mesh.quaternion).normalize();
        mesh.position.copy(player.mesh.position).add(forward.clone().multiplyScalar(-13));
        scene.add(mesh);
        missiles.push({
          mesh,
          target,
          velocity: forward.multiplyScalar(MISSILE_SPEED),
          life: 5,
          trailColor: torpColor
        });
        missileCooldown = PROFILE.missileCool;
        lockTimer = 0;
        lockTarget = null;
      }

      function enemyFire(enemy) {
        if (!enemy.alive) return;
        const dir = player.mesh.position.clone().sub(enemy.mesh.position).normalize();
        const pos = enemy.mesh.position.clone().add(dir.clone().multiplyScalar(12 * (enemy.scale || 1)));
        // feature 4: enemy bolts tinted by the firing enemy's own faction.
        const color = FACTION_COLOR[enemy.faction] || 0xff2c25;
        enemyShots.push(makeProjectile(pos, dir, color, ENEMY_SHOT_SPEED, "enemy"));
      }

      function spawnTrail(position, color, size) {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
        const mat = new THREE.PointsMaterial({
          color,
          size,
          transparent: true,
          opacity: 0.8,
          depthWrite: false
        });
        const mesh = new THREE.Points(geo, mat);
        mesh.position.copy(position);
        scene.add(mesh);
        trails.push({ mesh, life: 0.22, maxLife: 0.22 });
      }

      function spawnExplosion(position, count, colorA, colorB, scale) {
        count = Math.max(6, Math.round(count * FX.explosionMult));
        const positions = new Float32Array(count * 3);
        const velocities = [];
        const colors = new Float32Array(count * 3);
        const ca = new THREE.Color(colorA);
        const cb = new THREE.Color(colorB);
        for (let i = 0; i < count; i += 1) {
          const v = randomDirection().multiplyScalar(rand(40, 95) * scale);
          velocities.push(v);
          const c = ca.clone().lerp(cb, Math.random());
          colors[i * 3] = c.r;
          colors[i * 3 + 1] = c.g;
          colors[i * 3 + 2] = c.b;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
        const mat = new THREE.PointsMaterial({
          size: 5.5 * scale,
          vertexColors: true,
          transparent: true,
          opacity: 1,
          depthWrite: false
        });
        const points = new THREE.Points(geo, mat);
        points.position.copy(position);
        scene.add(points);
        explosions.push({ points, velocities, life: 0.6, maxLife: 0.6 });
      }

      function destroyEnemy(enemy) {
        enemy.alive = false;
        aceKills += 1; // honor stat (cosmetic; clamped server-side)
        scene.remove(enemy.mesh);
        // kill emphasis: brighter, larger burst (PERF scaling handled inside spawnExplosion)
        spawnExplosion(enemy.mesh.position, 32, 0xfff066, 0xff671f, 1.4);
        playTone(180, 0.18, "sawtooth", 0.05);
      }

      function damagePlayer(amount) {
        if (!player.alive || player.invincible > 0) return;
        player.lastDamage = clock.elapsedTime;
        let remaining = amount;
        if (player.shield > 0) {
          const shieldHit = Math.min(player.shield, remaining);
          player.shield -= shieldHit;
          remaining -= shieldHit;
        }
        if (remaining > 0) {
          player.hull -= remaining;
        }
        shakeTimer = 0.28;
        shakePower = 2.8;
        setFlashColor(0.34, "#ff2e22"); // red damage flash (replaces neutral flash)
        playTone(140, 0.12, "square", 0.05);
        if (player.hull <= 0) {
          player.hull = 0;
          player.alive = false;
          spawnExplosion(player.mesh.position, 70, 0xff3b24, 0xffd15c, 1.75);
          scene.remove(player.mesh);
          setState("gameOver");
        }
      }

      function updatePlayer(dt) {
        if (!player.alive) return;

        // ── input source: analog touch stick overrides binary keys only while a finger drags it (feature 2) ──
        let pitchInput, yawInput, inputMag;
        if (touchStick.active) {
          // stick dy>0 (drag down) = pitch down, matching keyboard S/Down sign.
          pitchInput = clamp(touchStick.dy, -1, 1);
          yawInput = clamp(-touchStick.dx, -1, 1); // drag right = yaw right (negative, matches A-D sign below)
          inputMag = Math.min(1, Math.hypot(pitchInput, yawInput));
        } else {
          pitchInput = (keys.KeyS || keys.ArrowDown || touchKeys.pitchDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp || touchKeys.pitchUp ? 1 : 0);
          yawInput = (keys.KeyA || keys.ArrowLeft || touchKeys.yawLeft ? 1 : 0) - (keys.KeyD || keys.ArrowRight || touchKeys.yawRight ? 1 : 0);
          inputMag = Math.min(1, Math.hypot(pitchInput, yawInput));
        }

        const boosting = ((keys.ShiftLeft || keys.ShiftRight || touchKeys.boost)) && player.boost > 0;
        player.boosting = boosting;
        const braking = !!(keys.ControlLeft || keys.ControlRight || touchKeys.brake);

        // ── flight model (feature 1) ──
        // 1a: analog magnitude scales turn authority; high stick deflection turns tighter.
        // 1d: brake-turn — while braking AND steering, tighten yaw/pitch rate and raise turnLerp this frame.
        const brakeTurn = braking && inputMag > 0.05;
        const turnBoost = 1 + 0.55 * inputMag + (brakeTurn ? 0.6 : 0);   // up to ~1.6x in a brake-turn pivot
        const rollBank = yawInput * PROFILE.rollBank;
        const pitchRate = pitchInput * PROFILE.pitchRate * turnBoost;
        const yawRate = yawInput * PROFILE.yawRate * turnBoost;
        const turnLerp = Math.min(0.22, PROFILE.turnLerp * (brakeTurn ? 1.7 : 1));

        const deltaQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(
          pitchRate * dt,
          yawRate * dt,
          -rollBank * dt * 2.15,
          "XYZ"
        ));
        tempQuat.copy(player.mesh.quaternion).multiply(deltaQuat).normalize();
        player.mesh.quaternion.slerp(tempQuat, turnLerp);

        // 1b: cosmetic visual bank/tilt on the hull child only (root heading stays clean for the camera).
        // hullMesh lies flat (rot.x=-PI/2); bank = roll about its local Y, pitch-tilt = its local X delta.
        if (player.hullMesh) {
          const targetBank = -yawInput * 0.5;     // lean into the turn
          const targetTilt = -pitchInput * 0.28;  // nose tilt cue
          player.bankZ = (player.bankZ || 0) + (targetBank - (player.bankZ || 0)) * Math.min(1, dt * 6);
          player.tiltX = (player.tiltX || 0) + (targetTilt - (player.tiltX || 0)) * Math.min(1, dt * 6);
          player.hullMesh.rotation.set(-Math.PI / 2 + player.tiltX, player.bankZ, 0);
        }

        // 1c: scripted U-turn / flip maneuver — timed pitch sweep on the ROOT (camera trails automatically).
        if (player.maneuverTime > 0) {
          player.maneuverTime -= dt;
          const total = player.maneuverTotal || 0.6;
          // sweep PI over the maneuver duration about the local pitch (X) axis.
          player.mesh.rotateX((Math.PI / total) * dt);
          player.invincible = Math.max(player.invincible, 0.05);
          if (player.maneuverTime <= 0) player.maneuverTime = 0;
        }

        if (player.rollTime > 0) {
          player.rollTime -= dt;
          const spin = player.rollDir * (Math.PI * 2 / 0.4) * dt;
          player.mesh.rotateZ(spin);
          player.invincible = Math.max(player.invincible, 0.05);
          if (player.rollTime <= 0) {
            player.rollTime = 0;
          }
        }

        let speed = BASE_SPEED * PROFILE.speedMult;
        if (boosting) {
          speed *= PROFILE.boostMult;
          player.boost = Math.max(0, player.boost - 50 * dt);
        } else {
          player.boost = Math.min(100, player.boost + 20 * dt);
        }
        if (braking) speed *= BRAKE_MULT;

        const forward = forwardVec.clone().applyQuaternion(player.mesh.quaternion).normalize();
        const desiredVelocity = forward.multiplyScalar(speed);
        player.velocity.lerp(desiredVelocity, 0.075);
        player.mesh.position.add(player.velocity.clone().multiplyScalar(dt));

        const dist = player.mesh.position.length();
        if (dist > WORLD_RADIUS) {
          const normal = player.mesh.position.clone().normalize();
          player.mesh.position.copy(normal.multiplyScalar(WORLD_RADIUS - 3));
          player.velocity.add(normal.multiplyScalar(-player.velocity.dot(normal) * 1.55));
        }

        if (player.invincible > 0) player.invincible -= dt;
        if (clock.elapsedTime - player.lastDamage > 3) {
          player.shield = Math.min(100, player.shield + 10 * dt * (PROFILE.shieldRegenMult || 1));
        }
      }

      function startBarrelRoll(dir) {
        if (state !== "gameplay" || player.rollTime > 0 || !player.alive) return;
        player.rollTime = 0.4;
        player.rollDir = dir;
        player.invincible = 0.5;
        setFlash(0.24);
        window.setTimeout(() => setFlash(0), 90);
      }

      // ── U-turn / Immelmann flip (feature 1c): scripted 180° pitch sweep, brief invuln.
      function startManeuver() {
        if (state !== "gameplay" || !player.alive) return;
        if (player.maneuverTime > 0 || player.rollTime > 0) return; // block while another maneuver runs
        player.maneuverTotal = 0.6;
        player.maneuverTime = 0.6;
        player.invincible = Math.max(player.invincible, 0.7);
        setFlash(0.18);
        window.setTimeout(() => setFlash(0), 110);
      }
      // double-tap ↓↓ detection timestamp (gated on non-repeat in onKeyDown).
      let _lastDownTap = 0;

      // ── 1st/3rd person toggle (feature 5): cosmetic, heading-locked in both modes ──
      function toggleView() {
        viewMode = (viewMode === "third") ? "first" : "third";
        if (player && player.mesh) player.mesh.visible = (viewMode !== "first"); // hide own hull in cockpit view
        var b = document.getElementById("ace-view");
        if (b) b.textContent = (viewMode === "first") ? "1ST" : "3RD";
      }

      function updateCamera(dt) {
        if (!player || !player.mesh.parent) return;
        const forward = forwardVec.clone().applyQuaternion(player.mesh.quaternion).normalize();
        const up = upVec.clone().applyQuaternion(player.mesh.quaternion).normalize();
        let desired, lookAt;
        if (viewMode === "first") {
          // FIRST: camera at the nose, heading-locked (derives from player quaternion → still "controlled", no orbit).
          const noseOffset = 6 + PROFILE.camHeight * 0.05;
          desired = player.mesh.position.clone()
            .add(forward.clone().multiplyScalar(noseOffset))
            .add(up.clone().multiplyScalar(2));
          camera.position.lerp(desired, CAMERA_LERP);
          lookAt = player.mesh.position.clone().add(forward.clone().multiplyScalar(55));
        } else {
          // THIRD: existing controlled chase (preserved exactly).
          desired = player.mesh.position.clone()
            .add(forward.clone().multiplyScalar(-PROFILE.camDist))
            .add(up.clone().multiplyScalar(PROFILE.camHeight));
          camera.position.lerp(desired, CAMERA_LERP);
          lookAt = player.mesh.position.clone()
            .add(forward.clone().multiplyScalar(55))
            .add(up.clone().multiplyScalar(3));
        }
        camera.lookAt(lookAt);

        if (shakeTimer > 0) {
          shakeTimer -= dt;
          const strength = shakePower * (shakeTimer / 0.28);
          camera.position.x += rand(-strength, strength);
          camera.position.y += rand(-strength, strength);
        }

        // boost FOV widening (cosmetic): ease toward base+6deg while boosting, back to base otherwise
        const boostingNow = !!(player && player.boosting && player.alive);
        const targetFov = boostingNow ? baseFov + 6 : baseFov;
        if (Math.abs(camera.fov - targetFov) > 0.05) {
          camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 8);
          camera.updateProjectionMatrix();
        }
        if (hud.speedLines) hud.speedLines.style.opacity = boostingNow ? "1" : "0";
      }

      function updateEnemies(dt) {
        const now = clock.elapsedTime;
        for (const enemy of enemies) {
          if (!enemy.alive) continue;
          const toPlayer = player.mesh.position.clone().sub(enemy.mesh.position);
          const distance = toPlayer.length();
          const dir = toPlayer.normalize();
          const side = new THREE.Vector3().crossVectors(dir, upVec).normalize();
          if (side.lengthSq() < 0.01) side.set(1, 0, 0);
          const strafe = side.multiplyScalar(Math.sin(now * enemy.wobble + enemy.strafe) * 24);
          const desired = dir.multiplyScalar(enemy.speed).add(strafe);
          enemy.mesh.position.add(desired.multiplyScalar(dt));

          if (distance < 90) {
            enemy.mesh.position.add(player.mesh.position.clone().sub(enemy.mesh.position).normalize().multiplyScalar(-32 * dt));
          }

          const targetLook = player.mesh.position.clone().add(strafe.clone().multiplyScalar(0.1));
          enemy.mesh.lookAt(targetLook);

          const back = new THREE.Vector3(0, 0, 1).applyQuaternion(enemy.mesh.quaternion).normalize();
          for (let i = 0; i < FX.enemyTrailMax; i += 1) {
            if (Math.random() < 0.65 * FX.trailDensity) {
              spawnTrail(enemy.mesh.position.clone().add(back.clone().multiplyScalar(9 + i * 2)), 0xff5b31, 1.7 + i * 0.4);
            }
          }

          enemy.cooldown -= dt;
          if (enemy.cooldown <= 0 && distance < 520 && state === "gameplay") {
            enemyFire(enemy);
            enemy.cooldown = rand(2, 3);
          }

          if (enemy.mesh.position.length() > WORLD_RADIUS - 40) {
            enemy.mesh.position.multiplyScalar((WORLD_RADIUS - 40) / enemy.mesh.position.length());
          }
        }
      }

      function updateProjectiles(list, dt) {
        for (let i = list.length - 1; i >= 0; i -= 1) {
          const shot = list[i];
          shot.life -= dt;
          shot.mesh.position.add(shot.velocity.clone().multiplyScalar(dt));
          // feature 4: billboard additive streak toward camera, long-axis along travel dir (screen-space).
          if (shot.billboard && shot.streak && camera) {
            const planes = shot.glow ? [shot.streak, shot.glow] : [shot.streak];
            // screen-space angle of travel direction → roll so plane's local Y follows the streak.
            const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
            const dx = shot.dir.dot(camRight);
            const dy = shot.dir.dot(camUp);
            const roll = Math.atan2(dx, dy); // plane local +Y is its length axis
            for (let p = 0; p < planes.length; p += 1) {
              planes[p].quaternion.copy(camera.quaternion);
              planes[p].rotateZ(-roll);
            }
          }
          if (shot.life <= 0 || shot.mesh.position.length() > WORLD_RADIUS + 160) {
            scene.remove(shot.mesh);
            list.splice(i, 1);
          }
        }
      }

      function updateMissiles(dt) {
        for (let i = missiles.length - 1; i >= 0; i -= 1) {
          const missile = missiles[i];
          missile.life -= dt;
          if (!missile.target || !missile.target.alive || missile.life <= 0) {
            scene.remove(missile.mesh);
            missiles.splice(i, 1);
            continue;
          }
          const toTarget = missile.target.mesh.position.clone().sub(missile.mesh.position).normalize();
          const desired = toTarget.multiplyScalar(MISSILE_SPEED);
          missile.velocity.lerp(desired, MISSILE_TURN).normalize().multiplyScalar(MISSILE_SPEED);
          missile.mesh.position.add(missile.velocity.clone().multiplyScalar(dt));
          missile.mesh.scale.setScalar(1 + Math.sin(clock.elapsedTime * 32) * 0.16);
          spawnTrail(missile.mesh.position.clone(), missile.trailColor || 0xffe65a, 3.6);

          if (missile.mesh.position.distanceTo(missile.target.mesh.position) < 13 * (missile.target.scale || 1)) {
            missile.target.hp -= PROFILE.missileDmg;
            if (missile.target.hp <= 0) destroyEnemy(missile.target);
            spawnExplosion(missile.mesh.position, 12, 0xfff57a, 0xff8a28, 0.8);
            scene.remove(missile.mesh);
            missiles.splice(i, 1);
          }
        }
      }

      function updateTrails(dt) {
        for (let i = trails.length - 1; i >= 0; i -= 1) {
          const trail = trails[i];
          trail.life -= dt;
          trail.mesh.material.opacity = Math.max(0, trail.life / trail.maxLife) * 0.8;
          trail.mesh.scale.multiplyScalar(1 + dt * 2.5);
          if (trail.life <= 0) {
            scene.remove(trail.mesh);
            trails.splice(i, 1);
          }
        }
      }

      function updateExplosions(dt) {
        for (let i = explosions.length - 1; i >= 0; i -= 1) {
          const exp = explosions[i];
          exp.life -= dt;
          const positions = exp.points.geometry.attributes.position.array;
          for (let p = 0; p < exp.velocities.length; p += 1) {
            positions[p * 3] += exp.velocities[p].x * dt;
            positions[p * 3 + 1] += exp.velocities[p].y * dt;
            positions[p * 3 + 2] += exp.velocities[p].z * dt;
          }
          exp.points.geometry.attributes.position.needsUpdate = true;
          exp.points.material.opacity = Math.max(0, exp.life / exp.maxLife);
          if (exp.life <= 0) {
            scene.remove(exp.points);
            explosions.splice(i, 1);
          }
        }
      }

      function updateCollisions() {
        for (let i = playerShots.length - 1; i >= 0; i -= 1) {
          const shot = playerShots[i];
          let hit = false;
          for (const enemy of enemies) {
            if (!enemy.alive) continue;
            // hit radius scales with hull size_class so large hulls stay hittable (feature 3).
            if (shot.mesh.position.distanceTo(enemy.mesh.position) < 8 * (enemy.scale || 1)) {
              enemy.hp -= PROFILE.plasmaDmg;
              if (enemy.hp <= 0) destroyEnemy(enemy);
              hit = true;
              break;
            }
          }
          if (hit) {
            scene.remove(shot.mesh);
            playerShots.splice(i, 1);
            showHitMarker();
            playTone(880, 0.04, "triangle", 0.03);
          }
        }

        for (let i = enemyShots.length - 1; i >= 0; i -= 1) {
          const shot = enemyShots[i];
          if (player.alive && shot.mesh.position.distanceTo(player.mesh.position) < 6) {
            damagePlayer(15);
            scene.remove(shot.mesh);
            enemyShots.splice(i, 1);
          }
        }
      }

      function updateLock(dt) {
        if (missileCooldown > 0) missileCooldown = Math.max(0, missileCooldown - dt);

        if ((!keys.KeyZ && !touchKeys.lock) || missileCooldown > 0 || state !== "gameplay") {
          lockTimer = 0;
          lockTarget = null;
          lockWasConfirmed = false;
          hud.lockWrap.style.opacity = "0";
          return;
        }

        const nearest = findNearestLockTarget();
        if (!nearest) {
          lockTimer = 0;
          lockTarget = null;
          lockWasConfirmed = false;
          hud.lockWrap.style.opacity = "1";
          return;
        }

        if (lockTarget !== nearest) {
          lockTarget = nearest;
          lockTimer = 0;
          lockWasConfirmed = false;
        }
        lockTimer += dt;
        hud.lockWrap.style.opacity = "1";
        // lock-confirm cue: fire once on the frame the lock completes
        if (lockTimer >= PROFILE.lockTime && !lockWasConfirmed) {
          lockWasConfirmed = true;
          confirmLockFx();
        }
        if (lockTimer >= PROFILE.lockTime) {
          fireMissile(lockTarget);
        }
      }

      // ── lock confirm: reticle pulse + tone (purely cosmetic) ──
      function confirmLockFx() {
        try {
          var c = document.getElementById("lockCircle");
          if (c) {
            c.style.transition = "transform 70ms ease-out, box-shadow 70ms ease-out";
            c.style.boxShadow = "0 0 26px rgba(255,220,64,0.95), inset 0 0 22px rgba(255,220,64,0.55)";
            c.style.transform = "scale(1.18)";
            window.setTimeout(function () {
              c.style.transform = "scale(1)";
              c.style.boxShadow = "0 0 18px rgba(0, 255, 206, 0.35), inset 0 0 18px rgba(0, 255, 206, 0.18)";
            }, 130);
          }
        } catch (_) {}
        playTone(1040, 0.07, "sine", 0.04);
      }

      function updateHud(time) {
        const shield = player ? Math.round(player.shield) : 100;
        const hull = player ? Math.round(player.hull) : 100;
        const boost = player ? Math.round(player.boost) : 100;
        const aliveEnemies = enemies.filter(enemy => enemy.alive).length;
        hud.shieldText.textContent = String(shield);
        hud.hullText.textContent = String(hull);
        hud.boostText.textContent = String(boost);
        hud.enemyText.textContent = String(aliveEnemies);
        const hullMax = (player && player.hullMax) || 100;
        hud.shieldFill.style.width = clamp(shield, 0, 100) + "%";
        hud.hullFill.style.width = clamp((hull / hullMax) * 100, 0, 100) + "%";
        hud.boostFill.style.width = clamp(boost, 0, 100) + "%";

        const plasmaReady = time - lastShotTime >= PROFILE.plasmaCool;
        hud.plasmaText.textContent = plasmaReady ? "READY" : "COOLING";
        hud.plasmaText.style.color = plasmaReady ? "#7dffe8" : "#ffd66b";
        hud.missileText.textContent = missileCooldown <= 0 ? "READY" : missileCooldown.toFixed(1) + "s";
        hud.missileText.style.color = missileCooldown <= 0 ? "#7dffe8" : "#ffd66b";

        const progress = clamp(lockTimer / PROFILE.lockTime, 0, 1);
        hud.lockProgress.style.background =
          "conic-gradient(rgba(255, 220, 64, 0.95) 0deg, rgba(255, 220, 64, 0.95) " +
          Math.floor(progress * 360) +
          "deg, transparent " +
          Math.floor(progress * 360) +
          "deg), radial-gradient(circle, transparent 62%, rgba(0, 255, 206, 0.18) 63%, transparent 67%)";

        if (lockTarget && lockTarget.alive) {
          hud.lockStatusText.textContent = progress >= 1 ? "LOCKED" : "LOCKING " + Math.floor(progress * 100) + "%";
          hud.lockText.textContent = progress >= 1 ? "LOCKED" : "LOCKING";
          hud.lockCircle.style.borderColor = progress >= 1 ? "rgba(255, 220, 64, 0.95)" : "rgba(0, 255, 206, 0.7)";
        } else if (keys.KeyZ && missileCooldown <= 0 && state === "gameplay") {
          hud.lockStatusText.textContent = "NO TARGET";
          hud.lockText.textContent = "NO TARGET";
        } else {
          hud.lockStatusText.textContent = "STANDBY";
          hud.lockText.textContent = "LOCKING";
        }
      }

      function checkVictory() {
        if (state !== "gameplay") return;
        if (enemies.length > 0 && enemies.every(enemy => !enemy.alive)) {
          setState("missionComplete");
        }
      }

      function updateTitleDrift(dt) {
        if (!player) return;
        player.mesh.rotation.y += dt * 0.18;
        player.mesh.rotation.z = Math.sin(clock.elapsedTime * 0.8) * 0.12;
        camera.position.lerp(new THREE.Vector3(0, 28, 88), 0.03);
        camera.lookAt(player.mesh.position);
      }

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.033);
        const time = clock.elapsedTime;

        if (state === "gameplay") {
          if (keys.Space || touchKeys.fire) firePlasma(time);
          updatePlayer(dt);
          updateEnemies(dt);
          updateLock(dt);
          updateProjectiles(playerShots, dt);
          updateProjectiles(enemyShots, dt);
          updateMissiles(dt);
          updateChargeBeam(dt, time); // feature 4: titan continuous beam (no-op for other tiers)
          updateCollisions();
          updateCamera(dt);
          checkVictory();
        } else {
          updateTitleDrift(dt);
          updateProjectiles(playerShots, dt);
          updateProjectiles(enemyShots, dt);
          updateMissiles(dt);
          hideBeam(); // feature 4: never leave the charge beam visible outside gameplay
          if (hud.speedLines && hud.speedLines.style.opacity !== "0") hud.speedLines.style.opacity = "0";
        }

        updateTrails(dt);
        updateExplosions(dt);
        updateMuzzleFlashes(dt);
        updateHud(time);
        renderer.render(scene, camera);
      }

      function onKeyDown(event) {
        keys[event.code] = true;
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) {
          event.preventDefault();
        }

        if (event.code === "Enter" && (state === "titleScreen" || state === "missionComplete")) {
          resetGame();
        } else if (event.code === "KeyR" && state === "gameOver") {
          resetGame();
        } else if (event.code === "Space") {
          firePlasma(clock.elapsedTime);
        } else if (event.code === "KeyQ") {
          startBarrelRoll(-1);
        } else if (event.code === "KeyE") {
          startBarrelRoll(1);
        } else if (event.code === "KeyV" && !event.repeat) {
          toggleView();
        } else if ((event.code === "ArrowDown" || event.code === "KeyS") && !event.repeat && state === "gameplay") {
          // double-tap down → U-turn flip (1c). repeat-gated to avoid auto-repeat misfire.
          const nowMs = (typeof performance !== "undefined" ? performance.now() : Date.now());
          if (nowMs - _lastDownTap < 280) {
            startManeuver();
            _lastDownTap = 0;
          } else {
            _lastDownTap = nowMs;
          }
        }
      }

      function onKeyUp(event) {
        keys[event.code] = false;
      }

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("keyup", onKeyUp);
      window.addEventListener("resize", onResize);

      // ── touch control layer (feature 2): built only on touch devices; desktop unaffected ──
      function setupTouchControls() {
        if (!TOUCH) return;
        const root = document.getElementById("aceTouch");
        const stick = document.getElementById("ace-stick");
        const knob = document.getElementById("ace-stick-knob");
        if (!root || !stick || !knob) return;
        root.classList.add("on");

        // virtual stick → normalized touchStick.dx/dy
        let stickId = null;
        const maxR = 50; // px travel for full deflection
        function setKnob(nx, ny) {
          knob.style.transform = "translate(" + (nx * maxR) + "px," + (ny * maxR) + "px)";
        }
        function stickMove(ev, t) {
          const rect = stick.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          let dx = (t.clientX - cx) / maxR;
          let dy = (t.clientY - cy) / maxR;
          const mag = Math.hypot(dx, dy);
          if (mag > 1) { dx /= mag; dy /= mag; }
          touchStick.dx = dx;
          touchStick.dy = dy;
          setKnob(dx, dy);
        }
        stick.addEventListener("pointerdown", function (ev) {
          ev.preventDefault();
          stickId = ev.pointerId;
          touchStick.active = true;
          try { stick.setPointerCapture(ev.pointerId); } catch (_) {}
          stickMove(ev, ev);
        });
        stick.addEventListener("pointermove", function (ev) {
          if (stickId !== ev.pointerId) return;
          ev.preventDefault();
          stickMove(ev, ev);
        });
        function stickEnd(ev) {
          if (stickId !== ev.pointerId) return;
          stickId = null;
          touchStick.active = false;
          touchStick.dx = 0; touchStick.dy = 0;
          setKnob(0, 0);
        }
        stick.addEventListener("pointerup", stickEnd);
        stick.addEventListener("pointercancel", stickEnd);
        stick.addEventListener("lostpointercapture", stickEnd);

        // action buttons via delegated-style binding (addEventListener per button; §19 — no inline onclick)
        function bindHold(id, flag) {
          const el = document.getElementById(id);
          if (!el) return;
          el.addEventListener("pointerdown", function (ev) { ev.preventDefault(); touchKeys[flag] = true; });
          const off = function (ev) { ev.preventDefault(); touchKeys[flag] = false; };
          el.addEventListener("pointerup", off);
          el.addEventListener("pointercancel", off);
          el.addEventListener("pointerleave", off);
        }
        function bindTap(id, fn) {
          const el = document.getElementById(id);
          if (!el) return;
          el.addEventListener("pointerdown", function (ev) { ev.preventDefault(); fn(); });
        }
        bindHold("ace-fire", "fire");
        bindHold("ace-lock", "lock");
        bindHold("ace-boost", "boost");
        bindHold("ace-brake", "brake");
        bindTap("ace-uturn", startManeuver);
        bindTap("ace-roll", function () { startBarrelRoll(1); });
        bindTap("ace-view", toggleView);
      }
      setupTouchControls();

      createStarfield();
      addBoundaryShell();
      player = makePlayer();
      player.mesh.position.set(0, 0, 0);
      camera.position.set(0, 28, 88);
      camera.lookAt(0, 0, 0);
      for (let i = 0; i < ENEMY_SPAWN_COUNT; i += 1) {
        enemies.push(makeEnemy(i));
      }
      setState("titleScreen");
      animate();
        } catch(e) {
          document.body.innerHTML = '<div style="color:#f55;padding:40px;font-family:monospace;font-size:18px">ERROR: ' + e.message + '<br><br>' + e.stack + '</div>';
        }
      }
      window.addEventListener('load', bootstrapAndStart);
    }());
  </script>
</body>
</html>
