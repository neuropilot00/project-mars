    <path d="M212 96 C365 172 568 174 790 82"/>
    <ellipse cx="578" cy="142" rx="233" ry="82" transform="rotate(-7 578 142)"/>
  </g>
  <g filter="url(#magGlow)">
    <g transform="translate(555 132) rotate(-3) scale(1.34)">
      <polygon points="-126,-13 -58,-24 18,-18 132,0 18,18 -58,24 -126,13 -92,0" fill="url(#ship)"/>
      <polygon points="-50,-10 62,0 -50,10 -22,0" fill="#090513" opacity=".84"/>
      <rect x="-111" y="-4" width="52" height="8" fill="#ff52d2" opacity=".68"/>
      <rect x="-23" y="-3" width="42" height="6" fill="#ffd7ff" opacity=".42"/>
