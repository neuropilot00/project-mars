<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="PREMIUM CRATE four star banner">
  <defs>
    <radialGradient id="bg" cx="62%" cy="42%" r="82%">
      <stop offset="0" stop-color="#6a1a8a"/>
      <stop offset=".43" stop-color="#1e1038"/>
      <stop offset="1" stop-color="#040611"/>
    </radialGradient>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4bdd" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#7d2cff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#12051c" stop-opacity="0"/>
