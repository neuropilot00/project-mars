      <stop offset="1" stop-color="#0c0716"/>
    </linearGradient>
    <filter id="magGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cloud" x="-35%" y="-45%" width="170%" height="190%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="900" height="300" fill="url(#bg)"/>
  <g filter="url(#cloud)">
    <ellipse cx="570" cy="106" rx="265" ry="70" fill="url(#nebula)"/>
    <ellipse cx="376" cy="176" rx="210" ry="52" fill="#bd34ff" opacity=".25"/>
    <ellipse cx="690" cy="205" rx="170" ry="42" fill="#ff2fa7" opacity=".22"/>
  </g>
  <g fill="#ffc8ff" opacity=".76">
    <circle cx="36" cy="43" r="1.2"/><circle cx="105" cy="86" r="1.6"/><circle cx="159" cy="28" r="1.1"/><circle cx="224" cy="127" r="1.4"/>
    <circle cx="302" cy="65" r="1.1"/><circle cx="415" cy="31" r="1.5"/><circle cx="486" cy="91" r="1.1"/><circle cx="610" cy="39" r="1.4"/>
    <circle cx="704" cy="83" r="1.1"/><circle cx="780" cy="28" r="1.7"/><circle cx="845" cy="126" r="1.2"/><circle cx="646" cy="232" r="1.4"/>
  </g>
  <g stroke="#ff42d7" stroke-width="2" fill="none" opacity=".5" filter="url(#magGlow)">
