      <polygon points="-38,-8 48,0 -38,8" fill="#090513" opacity=".84"/>
      <rect x="-87" y="-3" width="39" height="6" fill="#ff52d2" opacity=".68"/>
    </g>
    <g transform="translate(250 91) rotate(-14) scale(.82)">
